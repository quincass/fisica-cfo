<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eletromagnetismo · 18 dinâmicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3eee5;--card:#fffbf4;--card2:#f8f1e5;--ink:#1f1a16;--mute:#6d6257;--line:#ddd1c0;
--acc:#b3261e;--dir:#b3261e;--apo:#a86400;--exe:#2c6a39;--neu:#3d4a5c;
--ok:#2c6a39;--okbg:#e3f1e3;--bad:#b3261e;--badbg:#fbe5e1;--mid:#a86400;--midbg:#fbefd9;--hid:#e2d7c6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120f;--card:#201a15;--card2:#2a221b;--ink:#efe6da;--mute:#a89b8d;--line:#3b3229;--acc:#ef6a5e;--dir:#ef6a5e;--apo:#e7a23d;--exe:#6cc07b;--neu:#93a7c2;--ok:#6cc07b;--okbg:#1d2e20;--bad:#ef6a5e;--badbg:#3a1c18;--mid:#e7a23d;--midbg:#36290f;--hid:#3b3229}}
:root[data-theme="dark"]{--bg:#16120f;--card:#201a15;--card2:#2a221b;--ink:#efe6da;--mute:#a89b8d;--line:#3b3229;--acc:#ef6a5e;--dir:#ef6a5e;--apo:#e7a23d;--exe:#6cc07b;--neu:#93a7c2;--ok:#6cc07b;--okbg:#1d2e20;--bad:#ef6a5e;--badbg:#3a1c18;--mid:#e7a23d;--midbg:#36290f;--hid:#3b3229}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
header{position:static;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:980px;margin:0 auto;padding:10px 14px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{flex:1;min-width:200px}
.brand h1{font:600 1.25rem/1.15 Spectral,Georgia,serif;margin:0}
.brand p{margin:2px 0 0;color:var(--mute);font-size:.82rem}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{border:0;background:var(--card);padding:7px 11px;font-size:.88rem;font-weight:500}
.modes button+button{border-left:1px solid var(--line)}
.modes button.on{background:var(--ink);color:var(--bg)}
.quick{display:flex;gap:6px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:.88rem;font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:8px 11px 10px;font-size:.88rem;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tabs button .n{display:inline-block;min-width:1.3em;font-variant-numeric:tabular-nums;color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:20px 14px 90px}
h2{font:600 1.55rem/1.2 Spectral,Georgia,serif;margin:0 0 6px}
h3{font:600 1.15rem/1.25 Spectral,Georgia,serif;margin:22px 0 8px}
.lead{color:var(--mute);margin:0 0 18px;max-width:68ch}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:500}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mute);margin:0 4px 4px 0}
.tag.arm{background:var(--badbg);border-color:transparent;color:var(--bad);font-weight:600}
.tag.al{cursor:default}
.artl{font-size:.82rem;text-decoration:underline;color:var(--mute);background:none;border:0;padding:0}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.meta{font-size:.82rem;color:var(--mute)}
/* questão */
.q{font:1.12rem/1.6 Spectral,Georgia,serif;margin:6px 0 14px}
.ans{display:flex;gap:10px;margin:8px 0}
.ans .btn{flex:1;font-size:1rem;padding:12px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:4px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb .v{font-weight:700;margin-bottom:4px}
.fb p{margin:.35em 0}
.alts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.alt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font:1rem/1.5 Spectral,Georgia,serif}
.alt b{font-family:Archivo,sans-serif;flex:none;width:1.4em}
.alt.right{border-color:var(--ok);background:var(--okbg)}
.alt.wrong{border-color:var(--bad);background:var(--badbg)}
.alt .ac{display:block;font:.9rem/1.45 Archivo,sans-serif;color:var(--ink);margin-top:5px}
/* card */
.fc{min-height:150px}
.fc .face{font:1.12rem/1.6 Spectral,Georgia,serif;white-space:pre-line}
.fc .back{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.fc .back .face{font-weight:600}
.fc .x{margin-top:10px;font-size:.92rem;color:var(--mute);white-space:pre-line}
.grade{display:flex;gap:8px;margin-top:14px}
.grade .btn{flex:1;padding:12px}
.g0{border-color:var(--bad)!important;color:var(--bad)}
.g1{border-color:var(--mid)!important;color:var(--mid)}
.g2{border-color:var(--ok)!important;color:var(--ok)}
/* lei */
.lei{font:1.06rem/1.75 Spectral,Georgia,serif}
.lei .tt{font:600 .85rem Archivo,sans-serif;color:var(--mute);margin:22px 0 4px}
.lei p{margin:.45em 0;scroll-margin-top:150px}
.lei p.inc{padding-left:1.2em}
.lei .note{display:none;font:.9rem/1.45 Archivo,sans-serif;background:var(--midbg);border-left:3px solid var(--mid);padding:6px 10px;border-radius:4px;margin:4px 0 10px}
.lei.anot .note{display:block}
.om{border-radius:3px}
.lei.omit .om:not(.rev){background:var(--hid);color:transparent;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:inset 0 -2px 0 var(--acc)}
.lei.omit .om.rev{background:var(--midbg);font-weight:600}
.omk{display:inline-flex;gap:3px;vertical-align:middle;margin:0 3px}
.omk button{border:1px solid var(--line);background:var(--card);border-radius:5px;font:600 .75rem Archivo,sans-serif;padding:1px 6px}
.cfn{font-size:.88rem;color:var(--mute)}
/* mapa */
.mapwrap{position:relative;height:78vh;min-height:460px;border:1px solid var(--line);border-radius:10px;background:var(--card2);overflow:hidden;touch-action:none}
.mapin{position:absolute;left:0;top:0;transform-origin:0 0}
.mapin svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mn{position:absolute;width:220px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--neu));border-radius:8px;padding:7px 9px 8px;font-size:.86rem;line-height:1.35;box-shadow:0 1px 0 var(--line)}
.mn.root{width:190px;background:var(--ink);color:var(--bg);border-color:var(--ink);font:600 1rem/1.25 Spectral,serif}
.mn .mt{font-weight:600}
.mn .ma{margin-top:3px}
.mn .mq{font-style:italic;color:var(--mute)}
.mn .mx{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.mn .tg{border:1px solid var(--line);background:var(--card2);border-radius:5px;font:600 .75rem Archivo,sans-serif;padding:1px 7px;color:var(--c,var(--neu))}
.mn .wb{color:var(--bad);font-weight:700;border:0;background:none;padding:0 2px}
.mn .wt{display:none;margin-top:5px;background:var(--badbg);border-left:3px solid var(--bad);padding:5px 7px;border-radius:4px;font-size:.82rem}
.mn .wt.show{display:block}
.mn.hidden-a .ma,.mn.hidden-a .mt2{display:none}
.mn.testable{cursor:pointer}
.mn.got{outline:2px solid var(--ok)}
.mn.miss{outline:2px solid var(--bad)}
.mapctl{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3}
.mapctl button{border:1px solid var(--line);background:var(--card);border-radius:6px;width:34px;height:34px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--mute);margin:10px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rel{font:600 11px Archivo,sans-serif;fill:var(--mute)}
/* tabelas */
.tw{overflow-x:auto;margin:10px 0 20px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card2);font-weight:600}
/* microconceitos */
.mc{margin-bottom:14px}
.mc h3{margin:0 0 8px}
.mc dl{margin:0}
.mc dt{font-weight:600;font-size:.84rem;color:var(--mute);margin-top:10px}
.mc dd{margin:2px 0 0}
.mc .inf{font-size:.84rem;color:var(--mid);font-weight:600}
.sond{display:inline-block;font-size:.76rem;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle}
/* painel */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:600 1.8rem Spectral,serif}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
textarea{width:100%;min-height:170px;font:.85rem/1.4 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
/* gaveta */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .sh{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.drawer .pn .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hl{animation:hl 1.8s ease}
@keyframes hl{0%{background:var(--midbg)}100%{background:transparent}}
.err{border-bottom:1px solid var(--line);padding:10px 0}
.err .et{font-family:Spectral,serif}
.empty{color:var(--mute);font-style:italic}
.done{text-align:center;padding:26px 10px}
.done b{font:600 2.2rem Spectral,serif;display:block}
@media (min-width:561px){header{position:sticky;top:env(safe-area-inset-top,0px)}}
@media (max-width:560px){.brand h1{font-size:1.08rem}.q{font-size:1.05rem}h2{font-size:1.3rem}.mn{width:190px}}
</style>
</head>
<body>
<header><div class="hwrap">
 <div class="top">
  <div class="brand"><h1></h1><p></p></div>
  <div class="modes"><button data-mode="estudo">Estudo</button><button data-mode="revisao">Revisão</button><button data-mode="micro">Micro 10′</button><button data-mode="pacotes">Pacotes</button></div>
  <div class="quick"><button id="bLei">Regras</button><button id="bErr">Erros</button></div>
 </div>
 <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="view"></main>
<div class="drawer" id="drawer"><div class="sh" id="dSh"></div><div class="pn"><div class="hd"><b id="dT"></b><button class="btn sm" id="dX">Fechar ✕</button></div><div id="dB"></div></div></div>
<script>
// ===================== DADOS · ELETROMAGNETISMO · 18 DINÂMICAS =====================
const LEI_NOME = "Eletromagnetismo";
const BLOCO = "18 dinâmicas";
const BLOCO_H1 = "Eletromagnetismo · 18 dinâmicas";
const BLOCO_SUB = "Revisão num lugar só: regras, mapa, cards, baterias e os pacotes do caderno TEC";
const ARTS_LABEL = "as 18 regras";
const MICRO_NOTE = "Fontes: aulas 0001–0024, fichas 01–09, revisao.md (pontos A–AF) e moldes do /reverso. Contas das questões novas conferidas em Python.";
const KEY = "em18_revisao_v1";
const MAP_LEGEND = {"dir": "Grupo 1 · conceito", "apo": "Grupo 2 · figura e sentido", "exe": "Famílias I e II · campo e carga", "neu": "Família III · indução com número"};
const MAP_SIDE = {"n1": -1, "n2": -1, "n3": 1, "n4": 1};
const ALVOS = {"D01": "D1 · Ímãs: polos, quebra ao meio, materiais", "D02": "D2 · Bússola e campo magnético terrestre", "D03": "D3 · Oersted: corrente cria campo", "D04": "D4 · Indução no cotidiano", "D05": "D5 · Maxwell e a história", "D06": "D6 · Força sobre carga: direção e sentido", "D07": "D7 · Força sobre fio e espira, motor", "D08": "D8 · Lenz: sentido da corrente induzida", "D09": "D9 · Gráficos", "D10": "D10 · Campo criado por fio, espira e solenoide", "D11": "D11 · Superposição e campo nulo", "D12": "D12 · Fios paralelos: atração e força", "D13": "D13 · Força com ângulo (q·v·B·sen θ)", "D14": "D14 · Carga em círculo: raio e período", "D15": "D15 · Seletor de velocidades", "D16": "D16 · Fluxo magnético", "D17": "D17 · Faraday com número", "D18": "D18 · Transformador"};
const LEI = [{"tt": "GRUPO 1 · CONCEITO PURO, ZERO CÁLCULO"}, {"id": "r1", "art": 1, "t": "<b>D1 · Ímãs.</b> Todo ímã tem {{dois polos inseparáveis|D01}}: partido ao meio, vira {{dois ímãs completos|D01}}. Polos de mesmo nome {{se repelem|D01}}. Fora do ímã as linhas vão do {{norte para o sul|D01}}; dentro, do sul para o norte, porque as linhas são {{curvas fechadas|D01}}.", "n": "⚠ Ferro é atraído por qualquer polo (o polo dele é induzido na hora). Alumínio não é atraído — e não ser atraído não é ser repelido."}, {"id": "r2", "art": 2, "t": "<b>D2 · Bússola e Terra.</b> A agulha se deita sobre a {{linha de campo que passa nela|D02}}. Perto do polo norte geográfico fica um {{polo sul magnético|D02}}. Os polos magnéticos {{não coincidem|D02}} com os geográficos (declinação), e a inclinação da agulha é {{zero no equador|D02}} magnético e máxima nos polos.", "n": "⚠ Com ímã ou fio perto, a bússola obedece ao campo resultante, não só ao da Terra."}, {"id": "r3", "art": 3, "t": "<b>D3 · Oersted.</b> Corrente elétrica {{cria campo magnético|D03}}. Em volta de um fio reto as linhas são {{circunferências concêntricas|D03}}, num plano {{perpendicular ao fio|D03}}. Sentido: {{polegar direito na corrente|D03}}, os dedos dão o giro do campo. Bobina com núcleo de ferro é um {{eletroímã|D03}}.", "n": "⚠ Os dois lados de um fio têm campos opostos: à direita entra, à esquerda sai (corrente para cima, fio no papel)."}, {"id": "r4", "art": 4, "t": "<b>D4 · Indução no cotidiano.</b> Só há corrente induzida quando o {{fluxo magnético varia|D04}} no circuito. Ímã parado dentro da bobina: {{nenhuma corrente|D04}}. É o princípio do gerador, do fogão de indução, do carregador sem fio, do RFID, do microfone e do {{transformador|D04}}.", "n": "⚠ Fogão de indução aquece a panela por correntes induzidas nela (efeito Joule), não por radiação nem por condução."}, {"id": "r5", "art": 5, "t": "<b>D5 · Maxwell.</b> Maxwell reuniu eletricidade e magnetismo em {{quatro equações|D05}} e previu {{ondas eletromagnéticas|D05}} viajando à {{velocidade da luz|D05}}. A luz é uma onda eletromagnética, {{transversal|D05}}: E e B perpendiculares entre si e à propagação. {{Hertz|D05}} produziu as ondas em laboratório.", "n": "⚠ Ordem histórica: Oersted (1820) → Faraday (1831) → Maxwell (1864) → Hertz (1887)."}, {"tt": "GRUPO 2 · FIGURA E DECISÃO DE SENTIDO"}, {"id": "r6", "art": 6, "t": "<b>D6 · Força sobre carga.</b> A força magnética é {{perpendicular à velocidade e ao campo|D06}}, ao mesmo tempo. Regra do tapa: dedos no campo, polegar na velocidade, a palma empurra a {{carga positiva|D06}}; para carga {{negativa, inverte|D06}}. Três zeros: carga {{parada|D06}}, velocidade {{paralela ao campo|D06}}, campo nulo.", "n": "⚠ A força magnética nunca realiza trabalho: muda a direção, nunca o módulo da velocidade."}, {"id": "r7", "art": 7, "t": "<b>D7 · Força sobre fio.</b> <b>F = B · i · L · sen θ</b>, θ entre o {{fio e o campo|D07}}. A regra é a mesma do tapa, com o polegar na {{corrente|D07}}. Uma espira com corrente dentro do campo sofre forças opostas nos lados: {{gira|D07}} — é o motor elétrico. Fio paralelo ao campo: {{força zero|D07}}.", "n": "⚠ Inverter a corrente (ou o campo) inverte o sentido de giro do motor."}, {"id": "r8", "art": 8, "t": "<b>D8 · Lenz.</b> A corrente induzida cria um campo que se opõe à {{variação do fluxo|D08}} — não ao fluxo. Ímã chegando: a espira cria um polo {{igual ao que chega|D08}} (repele). Ímã saindo: polo {{oposto|D08}} (atrai).", "n": "⚠ Lenz dá o sentido; Faraday dá o número. Questão de sentido não pede conta."}, {"id": "r9", "art": 9, "t": "<b>D9 · Gráficos.</b> No gráfico Φ × t, a fem é a {{inclinação|D09}}, não a altura: trecho horizontal dá {{fem zero|D09}}. Raio × velocidade é uma {{reta pela origem|D09}} (R ∝ v). Período × velocidade é {{horizontal|D09}}. B × distância do fio é uma hipérbole (B ∝ 1/d).", "n": "⚠ Fluxo máximo pode ter fem zero (topo da curva); fluxo zero pode ter fem máxima."}, {"tt": "GRUPO 3 · FAMÍLIA I · QUEM CRIA O CAMPO"}, {"id": "r10", "art": 10, "t": "<b>D10 · Campo criado.</b> Fio: <b>B = μ₀·i / (2π·d)</b>. Centro de espira: <b>B = μ₀·i / (2R)</b>, vezes {{N|D10}} se forem N voltas. Solenoide: <b>B = μ₀·n·i</b>, {{uniforme|D10}} dentro e quase {{nulo fora|D10}}. Atalho de prova: fator de B = {{fator de i ÷ fator da distância|D10}}.", "n": "⚠ Espira usa 2R; fio usa 2π·d. Trocar um pelo outro é o erro mais caro."}, {"id": "r11", "art": 11, "t": "<b>D11 · Superposição.</b> Some os campos de cada fonte {{como vetores|D11}}: mesmo sentido somam, opostos subtraem. Dois fios com correntes no mesmo sentido: o nulo fica {{entre eles|D11}}; em sentidos opostos, {{fora|D11}}. Sempre {{mais perto do fio de menor corrente|D11}}.", "n": "⚠ Correntes iguais e opostas: não existe ponto nulo."}, {"id": "r12", "art": 12, "t": "<b>D12 · Fios paralelos.</b> Correntes no mesmo sentido {{se atraem|D12}}; em sentidos opostos, {{se repelem|D12}}. <b>F = μ₀·i₁·i₂·L / (2π·d)</b>. A força em cada fio é {{igual|D12}}, mesmo com correntes diferentes (ação e reação).", "n": "⚠ É o contrário das cargas elétricas: aqui, igual atrai."}, {"tt": "GRUPO 3 · FAMÍLIA II · CARGA DENTRO DO CAMPO"}, {"id": "r13", "art": 13, "t": "<b>D13 · Força com ângulo.</b> <b>F = q · v · B · sen θ</b>, θ entre a {{velocidade e o campo|D13}}. θ = 90° dá a força {{máxima|D13}}; θ = 0° dá {{zero|D13}}.", "n": "⚠ A banca dá seno e cosseno juntos para ver se você escolhe o seno."}, {"id": "r14", "art": 14, "t": "<b>D14 · Carga em círculo.</b> Velocidade perpendicular ao campo: a força magnética faz o papel de {{centrípeta|D14}}. Raio: <b>R = m·v / (q·B)</b>. Período: <b>T = 2π·m / (q·B)</b>, que {{não depende da velocidade|D14}} nem da energia. Distância em n voltas = {{n · 2πR|D14}}.", "n": "⚠ Dobrar a energia não muda o tempo de meia volta (IAUPE CBM PE 2018)."}, {"id": "r15", "art": 15, "t": "<b>D15 · Seletor.</b> Campos E e B cruzados. Passa reto quem tem <b>v = E / B</b>, que {{não depende da carga nem da massa|D15}}. Mais rápida que isso: a força {{magnética|D15}} vence e ela desvia.", "n": "⚠ Escrever B/E dá número absurdo (10⁻⁶ m/s). Confira a ordem de grandeza."}, {"tt": "GRUPO 3 · FAMÍLIA III · INDUÇÃO COM NÚMERO"}, {"id": "r16", "art": 16, "t": "<b>D16 · Fluxo.</b> <b>Φ = B · A · cos θ</b>, θ entre o campo e a {{normal da espira|D16}}. Espira \"perpendicular ao campo\" tem fluxo {{máximo|D16}}; com o campo deitado no plano dela, fluxo {{zero|D16}}. Unidade: {{weber|D16}} (T·m²).", "n": "⚠ cm² → m² é fator 10⁻⁴: 2 cm de lado = 4 × 10⁻⁴ m² (CBM DF 2017)."}, {"id": "r17", "art": 17, "t": "<b>D17 · Faraday.</b> <b>ε = N · ΔΦ / Δt</b>. Varia B, a área ou o ângulo — {{um por questão|D17}}. Depois, a espira é circuito: <b>i = ε / R</b>. Barra deslizando: <b>ε = B · L · v</b>, L = {{comprimento da barra|D17}}, não a distância percorrida.", "n": "⚠ Esquecer o N, ou dividir por 15 em vez de 0,015 (ms → s)."}, {"id": "r18", "art": 18, "t": "<b>D18 · Transformador.</b> Ideal: {{P₁ = P₂|D18}}. <b>U₁/U₂ = N₁/N₂</b>: mais espiras no secundário, mais tensão e {{menos corrente|D18}}. Só funciona com {{corrente alternada|D18}}, porque precisa de fluxo variável.", "n": "⚠ Transformador troca tensão por corrente; não fabrica energia."}];

const CE = [{"id": "c1", "a": "D01", "t": "Ao partir um ímã ao meio, obtêm-se um polo norte isolado e um polo sul isolado.", "g": false, "arm": "Contradição", "c": "Partido, vira <b>dois ímãs completos</b>. Não existe monopolo.", "art": 1}, {"id": "c2", "a": "D01", "t": "Dentro de um ímã em barra, as linhas de campo vão do polo sul para o polo norte.", "g": true, "arm": "Literalidade", "c": "As linhas são fechadas: por fora N → S, por dentro <b>S → N</b>.", "art": 1}, {"id": "c3", "a": "D02", "t": "Nas proximidades do polo norte geográfico da Terra encontra-se um polo sul magnético.", "g": true, "arm": "Literalidade", "c": "A ponta norte da agulha é atraída para lá; só um polo <b>sul</b> atrai norte.", "art": 2}, {"id": "c4", "a": "D02", "t": "A agulha de uma bússola aponta exatamente para o polo norte geográfico.", "g": false, "arm": "Palavra absoluta", "c": "<b>Exatamente</b> derruba: há declinação, porque os polos magnéticos não coincidem com os geográficos.", "art": 2}, {"id": "c5", "a": "D03", "t": "As linhas de campo de um fio reto com corrente são retas paralelas ao fio.", "g": false, "arm": "Troca de termo", "c": "São <b>circunferências concêntricas</b>, num plano perpendicular ao fio.", "art": 3}, {"id": "c6", "a": "D03", "t": "Invertendo o sentido da corrente num fio, o sentido do campo magnético em torno dele também se inverte.", "g": true, "arm": "Literalidade", "c": "Polegar invertido, giro dos dedos invertido.", "art": 3}, {"id": "c7", "a": "D04", "t": "Um ímã parado no interior de uma bobina fechada induz nela uma corrente constante.", "g": false, "arm": "Condição omitida", "c": "Sem <b>variação</b> de fluxo não há corrente induzida, por mais forte que seja o ímã.", "art": 4}, {"id": "c8", "a": "D04", "t": "No fogão de indução, a panela é aquecida por correntes elétricas induzidas nela pelo campo magnético variável.", "g": true, "arm": "Literalidade", "c": "Correntes induzidas + efeito Joule na própria panela.", "art": 4}, {"id": "c9", "a": "D05", "t": "Maxwell previu que as ondas eletromagnéticas se propagam no vácuo com a velocidade da luz.", "g": true, "arm": "Literalidade", "c": "É a previsão que identificou a luz como onda eletromagnética.", "art": 5}, {"id": "c10", "a": "D05", "t": "Numa onda eletromagnética, os campos elétrico e magnético são paralelos à direção de propagação.", "g": false, "arm": "Troca de termo", "c": "A onda é <b>transversal</b>: E ⟂ B ⟂ propagação.", "art": 5}, {"id": "c11", "a": "D06", "t": "A força magnética sobre uma carga em movimento pode aumentar o módulo da velocidade dela.", "g": false, "arm": "Contradição", "c": "A força é sempre perpendicular à velocidade: <b>não realiza trabalho</b>, só vira.", "art": 6}, {"id": "c12", "a": "D06", "t": "Uma carga lançada paralelamente às linhas de um campo magnético uniforme não sofre força magnética.", "g": true, "arm": "Literalidade", "c": "θ = 0°, sen 0° = 0. Um dos três zeros.", "art": 6}, {"id": "c13", "a": "D07", "t": "Um fio com corrente, disposto paralelamente às linhas de um campo magnético, sofre força máxima.", "g": false, "arm": "Inversão", "c": "Paralelo ao campo: <b>força zero</b>. Máxima é perpendicular.", "art": 7}, {"id": "c14", "a": "D07", "t": "Num motor elétrico de espira, inverter o sentido da corrente inverte o sentido de giro.", "g": true, "arm": "Literalidade", "c": "As forças nos dois lados se invertem juntas.", "art": 7}, {"id": "c15", "a": "D08", "t": "A corrente induzida tem sempre sentido tal que se opõe ao fluxo magnético que atravessa a espira.", "g": false, "arm": "Troca de termo", "c": "Opõe-se à <b>variação</b> do fluxo, não ao fluxo. Se o fluxo diminui, ela o reforça.", "art": 8}, {"id": "c16", "a": "D08", "t": "Quando o polo norte de um ímã se aproxima de uma espira, a face da espira voltada para ele torna-se um polo norte.", "g": true, "arm": "Literalidade", "c": "Chegou, repele: polo igual ao que chega.", "art": 8}, {"id": "c17", "a": "D09", "t": "Num gráfico de fluxo × tempo, o trecho em que o fluxo é = q·v·B·sen θ, θ é o ângulo entre a velocidade e o campo magnético.", "g": true, "arm": "Literalidade", "c": "Entre v e B. Por isso entra o seno.", "art": 13}, {"id": "c26", "a": "D13", "t": "Uma carga com velocidade formando 30° com o campo sofre a mesma força que se formasse 90°.", "g": false, "arm": "Troca de valor", "c": "sen 30° = 0,5: a força cai à <b>metade</b>.", "art": 13}, {"id": "c27", "a": "D14", "t": "Dobrando a velocidade de uma carga em órbita circular num campo uniforme, o período da órbita dobra.", "g": false, "arm": "Intuição errada", "c": "T = 2πm/qB: <b>não depende de v</b>. O raio dobra, o período fica.", "art": 14}, {"id": "c28", "a": "D14", "t": "Um próton e um elétron com a mesma velocidade, perpendicular ao mesmo campo, descrevem órbitas de raios diferentes.", "g": true, "arm": "Literalidade", "c": "Mesma carga em módulo, massas diferentes: R = mv/qB, o do próton é muito maior. E giram em sentidos opostos.", "art": 14}, {"id": "c29", "a": "D15", "t": "A velocidade selecionada num seletor de velocidades depende da massa da partícula.", "g": false, "arm": "Contradição", "c": "v = E/B: <b>nem carga nem massa</b>.", "art": 15}, {"id": "c30", "a": "D15", "t": "Num seletor, uma partícula mais rápida que E/B é desviada no sentido da força magnética.", "g": true, "arm": "Literalidade", "c": "qvB cresce com v; qE não. A magnética vence.", "art": 15}, {"id": "c31", "a": "D16", "t": "Uma espira com o plano perpendicular às linhas de um campo uniforme tem fluxo nulo.", "g": false, "arm": "Plano × normal", "c": "Plano perpendicular → normal alinhada → <b>fluxo máximo</b>. Fluxo zero é com o campo deitado no plano.", "art": 16}, {"id": "c32", "a": "D16", "t": "Uma espira quadrada de 2 cm de lado, perpendicular a um campo de 2 T, tem fluxo de 8 × 10⁻⁴ Wb.", "g": true, "arm": "Conta", "c": "A = (2 × 10⁻²)² = 4 × 10⁻⁴ m²; Φ = 2 × 4 × 10⁻⁴. CBM DF 2017.", "art": 16}, {"id": "c33", "a": "D17", "t": "Dobrando o número de espiras e o tempo da variação de fluxo, a fem induzida dobra.", "g": false, "arm": "Fração", "c": "N dobra (×2), Δt dobra (÷2): a fem <b>fica igual</b>.", "art": 17}, {"id": "c34", "a": "D17", "t": "Numa barra deslizando sobre trilhos, a fem induzida é B·L·v, em que L é o comprimento da barra.", "g": true, "arm": "Literalidade", "c": "L é a barra (largura dos trilhos), não a distância percorrida.", "art": 17}, {"id": "c35", "a": "D18", "t": "Num transformador ideal que eleva a tensão, a corrente no secundário é maior que no primário.", "g": false, "arm": "Inversão", "c": "Ideal: P₁ = P₂. Tensão sobe → corrente <b>desce</b>.", "art": 18}, {"id": "c36", "a": "D18", "t": "Um transformador ligado a uma bateria de corrente contínua não produz tensão no secundário, em regime.", "g": true, "arm": "Condição", "c": "Corrente contínua não faz o fluxo variar: sem indução.", "art": 18}];
const MC = [{"id": "m1", "a": "D01", "art": 1, "q": "Três barras idênticas, X, Y e Z, são um ímã, uma de ferro e uma de alumínio, em ordem desconhecida. X atrai Y; X não atrai Z; Y não atrai Z. Pode-se afirmar com certeza que:", "o": [{"t": "Z é a barra de alumínio.", "c": "Correta: Z não é atraída por ninguém. Ímã e ferro se atraem mutuamente, então não dá para dizer qual de X e Y é o ímã.", "ok": 1}, {"t": "X é o ímã.", "c": "Errada: o teste de atração é simétrico. X pode ser o ferro e Y o ímã."}, {"t": "Y é a barra de ferro.", "c": "Errada: pelo mesmo motivo, Y pode ser o ímã."}, {"t": "Z é o ímã, porque não atrai ninguém.", "c": "Errada: um ímã atrairia o ferro."}, {"t": "Z é repelida por X.", "c": "Errada: não ser atraído não é ser repelido."}]}, {"id": "m2", "a": "D02", "art": 2, "q": "Uma bússola é levada do equador magnético até as proximidades de um polo magnético da Terra. O ângulo de inclinação da agulha em relação à horizontal:", "o": [{"t": "aumenta, chegando perto de 90° junto ao polo.", "c": "Correta: no equador o campo é horizontal; perto do polo, quase vertical.", "ok": 1}, {"t": "diminui, chegando a zero no polo.", "c": "Errada: inverteu os extremos."}, {"t": "fica constante, porque o campo da Terra é uniforme.", "c": "Errada: a direção do campo muda com a latitude."}, {"t": "é sempre 90°, em qualquer latitude.", "c": "Errada: no equador magnético a inclinação é zero."}, {"t": "depende só da declinação local.", "c": "Errada: declinação é o desvio horizontal, não a inclinação."}]}, {"id": "m3", "a": "D03", "art": 3, "q": "Um fio vertical, no plano do papel, conduz corrente de baixo para cima. Num ponto à esquerda do fio, também no plano do papel, o campo magnético:", "o": [{"t": "sai do papel.", "c": "Correta: polegar para cima, os dedos saem do papel à esquerda e entram à direita.", "ok": 1}, {"t": "entra no papel.", "c": "Errada: é o lado direito."}, {"t": "aponta para cima, paralelo ao fio.", "c": "Errada: o campo de um fio nunca é paralelo a ele."}, {"t": "aponta para a esquerda, afastando-se do fio.", "c": "Errada: o campo não é radial; ele gira em volta do fio."}, {"t": "é nulo, porque o ponto está no plano do fio.", "c": "Errada: o campo existe em todo ponto ao redor do fio."}]}, {"id": "m4", "a": "D04", "art": 4, "q": "Um ímã é mantido parado dentro de uma bobina ligada a um amperímetro. Depois, é retirado rapidamente. O amperímetro indica:", "o": [{"t": "corrente só durante a retirada.", "c": "Correta: só há indução enquanto o fluxo varia.", "ok": 1}, {"t": "corrente constante enquanto o ímã está parado lá dentro.", "c": "Errada: fluxo constante não induz nada."}, {"t": "corrente nas duas situações, maior com o ímã parado.", "c": "Errada: parado, o fluxo não varia."}, {"t": "nenhuma corrente, porque o ímã não toca o fio.", "c": "Errada: indução é sem contato."}, {"t": "corrente só se o ímã for de neodímio.", "c": "Errada: qualquer ímã induz, se o fluxo variar."}]}, {"id": "m5", "a": "D05", "art": 5, "q": "Sobre a contribuição de Maxwell ao eletromagnetismo, é correto afirmar que ele:", "o": [{"t": "previu a existência de ondas eletromagnéticas que se propagam com a velocidade da luz.", "c": "Correta.", "ok": 1}, {"t": "descobriu que a corrente elétrica desvia a agulha de uma bússola.", "c": "Errada: é Oersted (1820)."}, {"t": "descobriu a indução eletromagnética.", "c": "Errada: é Faraday (1831)."}, {"t": "produziu pela primeira vez ondas de rádio em laboratório.", "c": "Errada: é Hertz (1887)."}, {"t": "mostrou que as linhas de campo magnético nascem nos polos norte.", "c": "Errada: as linhas são fechadas; não nascem em lugar nenhum."}]}, {"id": "m6", "a": "D06", "art": 6, "q": "Um elétron se move para a direita, no plano do papel, num campo magnético que entra no papel. A força magnética sobre ele, no instante mostrado, aponta:", "o": [{"t": "para baixo, no plano do papel.", "c": "Correta: para um próton seria para cima (tapa); o elétron tem carga negativa, inverte.", "ok": 1}, {"t": "para cima, no plano do papel.", "c": "Errada: este é o sentido para carga positiva."}, {"t": "para a direita, no sentido do movimento.", "c": "Errada: a força é perpendicular à velocidade."}, {"t": "para fora do papel.", "c": "Errada: a força é perpendicular também ao campo."}, {"t": "é nula.", "c": "Errada: v ⟂ B dá força máxima."}]}, {"id": "m7", "a": "D07", "art": 7, "q": "Um fio de 0,3 m, com corrente de 4 A, está perpendicular a um campo de 0,5 T. A força magnética sobre o fio vale:", "o": [{"t": "0,6 N", "c": "Correta: F = B·i·L = 0,5 × 4 × 0,3.", "ok": 1}, {"t": "6,0 N", "c": "Errada: usou 3 m em vez de 0,3 m."}, {"t": "0,3 N", "c": "Errada: multiplicou por sen 30° sem haver ângulo."}, {"t": "2,4 N", "c": "Errada: esqueceu o B."}, {"t": "zero", "c": "Errada: zero é com o fio paralelo ao campo."}]}, {"id": "m8", "a": "D08", "art": 8, "q": "O polo sul de um ímã se afasta de uma espira. Para quem olha do lado do ímã, a face da espira voltada para ele se comporta como:", "o": [{"t": "polo norte, atraindo o ímã.", "c": "Correta: saiu, atrai. Para atrair um sul, a face vira norte.", "ok": 1}, {"t": "polo sul, repelindo o ímã.", "c": "Errada: isso é o que acontece quando o ímã chega."}, {"t": "polo sul, atraindo o ímã.", "c": "Errada: sul com sul repele."}, {"t": "polo norte, repelindo o ímã.", "c": "Errada: norte com sul atrai."}, {"t": "nenhum polo, porque o ímã está se afastando.", "c": "Errada: afastar também varia o fluxo."}]}, {"id": "m9", "a": "D09", "art": 9, "q": "No gráfico de fluxo × tempo de uma espira, o fluxo cresce em linha reta de 0 a 2 s, fica constante de 2 a 4 s e cai em linha reta até zero de 4 a 5 s. A fem induzida tem maior módulo:", "o": [{"t": "entre 4 e 5 s.", "c": "Correta: é o trecho mais inclinado (a mesma variação em metade do tempo).", "ok": 1}, {"t": "entre 2 e 4 s, onde o fluxo é máximo.", "c": "Errada: fluxo constante dá fem zero."}, {"t": "entre 0 e 2 s, onde o fluxo cresce.", "c": "Errada: cresce, mas mais devagar que a queda."}, {"t": "igual nos três trechos.", "c": "Errada: a fem é a inclinação, que muda de trecho para trecho."}, {"t": "no instante t = 2 s.", "c": "Errada: não é a altura que conta."}]}, {"id": "m10", "a": "D10", "art": 10, "q": "Uma espira circular de raio 10 cm conduz 5 A. Com μ₀ = 4π × 10⁻⁷ T·m/A, o campo no centro vale:", "o": [{"t": "π × 10⁻⁵ T", "c": "Correta: B = μ₀i/(2R) = 4π × 10⁻⁷ × 5 ÷ 0,2.", "ok": 1}, {"t": "2π × 10⁻⁵ T", "c": "Errada: usou R em vez de 2R."}, {"t": "10⁻⁵ T", "c": "Errada: usou a fórmula do fio (2π·d)."}, {"t": "π × 10⁻⁷ T", "c": "Errada: usou 10 m em vez de 0,1 m."}, {"t": "2π × 10⁻⁶ T", "c": "Errada: não corresponde a nenhum caminho correto."}]}, {"id": "m11", "a": "D11", "art": 11, "q": "Dois fios paralelos, a 40 cm um do outro, conduzem 2 A e 6 A no mesmo sentido. O ponto de campo nulo fica:", "o": [{"t": "entre os fios, a 10 cm do fio de 2 A.", "c": "Correta: 2/x = 6/(0,4 − x) → x = 0,1 m.", "ok": 1}, {"t": "entre os fios, a 10 cm do fio de 6 A.", "c": "Errada: o nulo fica perto do mais fraco."}, {"t": "no ponto médio, a 20 cm de cada fio.", "c": "Errada: só com correntes iguais."}, {"t": "fora dos fios, do lado do fio de 2 A.", "c": "Errada: fora é com sentidos opostos."}, {"t": "não existe ponto nulo.", "c": "Errada: inexistência é com correntes iguais e opostas."}]}, {"id": "m12", "a": "D12", "art": 12, "q": "Dois fios paralelos de 2 m, a 10 cm um do outro, conduzem 3 A e 5 A em sentidos opostos (μ₀ = 4π × 10⁻⁷ T·m/A). A força entre eles é:", "o": [{"t": "6 × 10⁻⁵ N, de repulsão.", "c": "Correta: F = 2 × 10⁻⁷ × 3 × 5 × 2 ÷ 0,1. Opostos repelem.", "ok": 1}, {"t": "6 × 10⁻⁵ N, de atração.", "c": "Errada: opostos repelem."}, {"t": "3 × 10⁻⁵ N, de repulsão.", "c": "Errada: é a força por metro; esqueceu L = 2 m."}, {"t": "6 × 10⁻⁷ N, de repulsão.", "c": "Errada: usou 10 m em vez de 0,1 m."}, {"t": "zero, porque as correntes são diferentes.", "c": "Errada: correntes diferentes ainda interagem."}]}, {"id": "m13", "a": "D13", "art": 13, "q": "Uma carga de 2 μC se move a 5 × 10³ m/s formando 30° com um campo de 0,4 T. A força magnética vale:", "o": [{"t": "2 × 10⁻³ N", "c": "Correta: 2 × 10⁻⁶ × 5 × 10³ × 0,4 × sen 30° (0,5).", "ok": 1}, {"t": "3,5 × 10⁻³ N", "c": "Errada: usou o cosseno."}, {"t": "4 × 10⁻³ N", "c": "Errada: esqueceu o seno."}, {"t": "2 N", "c": "Errada: usou 2 C em vez de 2 μC (10⁻⁶)."}, {"t": "zero", "c": "Errada: zero é com 0°."}]}, {"id": "m14", "a": "D14", "art": 14, "q": "Um próton (m = 1,6 × 10⁻²⁷ kg, q = 1,6 × 10⁻¹⁹ C) entra perpendicularmente num campo de 0,1 T a 2 × 10⁵ m/s. O raio da órbita é:", "o": [{"t": "2 cm", "c": "Correta: R = 1,6 × 10⁻²⁷ × 2 × 10⁵ ÷ (1,6 × 10⁻¹⁹ × 0,1) = 0,02 m.", "ok": 1}, {"t": "20 cm", "c": "Errada: erro de uma potência de 10."}, {"t": "2 mm", "c": "Errada: erro de uma potência de 10 para o outro lado."}, {"t": "4π cm", "c": "Errada: 2πR é a volta, não o raio."}, {"t": "depende do período, que não foi dado", "c": "Errada: o raio sai direto de mv/qB."}]}, {"id": "m15", "a": "D15", "art": 15, "q": "Num seletor, E = 4 × 10⁴ V/m e B = 0,2 T. A velocidade que atravessa sem desvio é:", "o": [{"t": "2 × 10⁵ m/s", "c": "Correta: v = E/B.", "ok": 1}, {"t": "5 × 10⁻⁶ m/s", "c": "Errada: B/E, a fórmula de cabeça para baixo."}, {"t": "8 × 10³ m/s", "c": "Errada: E × B."}, {"t": "depende da massa do íon", "c": "Errada: v = E/B não tem massa."}, {"t": "2 × 10³ m/s", "c": "Errada: erro de potência de 10."}]}, {"id": "m16", "a": "D16", "art": 16, "q": "Uma espira retangular de 10 cm × 20 cm está num campo de 0,5 T, com a normal fazendo 60° com o campo. O fluxo vale:", "o": [{"t": "5 × 10⁻³ Wb", "c": "Correta: A = 0,1 × 0,2 = 0,02 m²; Φ = 0,5 × 0,02 × cos 60°.", "ok": 1}, {"t": "1 × 10⁻² Wb", "c": "Errada: esqueceu o cosseno."}, {"t": "8,7 × 10⁻³ Wb", "c": "Errada: usou sen 60°."}, {"t": "50 Wb", "c": "Errada: deixou a área em cm²."}, {"t": "zero", "c": "Errada: zero é com 90° entre o campo e a normal."}]}, {"id": "m17", "a": "D17", "art": 17, "q": "Uma bobina de 100 espiras, área 0,01 m² e resistência 8 Ω tem o campo perpendicular ao plano subindo de 0,2 T para 0,6 T em 0,1 s. A corrente induzida média é:", "o": [{"t": "0,5 A", "c": "Correta: ε = 100 × 0,4 × 0,01 ÷ 0,1 = 4 V; i = 4 ÷ 8.", "ok": 1}, {"t": "4 A", "c": "Errada: parou na fem (4 V) e a chamou de corrente."}, {"t": "5 × 10⁻³ A", "c": "Errada: esqueceu o N = 100."}, {"t": "0,75 A", "c": "Errada: usou 0,6 T em vez da variação 0,4 T."}, {"t": "32 A", "c": "Errada: multiplicou pela resistência."}]}, {"id": "m18", "a": "D18", "art": 18, "q": "Um transformador ideal tem 500 espiras no primário e 2500 no secundário. Ligado em 120 V, com 5 A no primário, o secundário fornece:", "o": [{"t": "600 V e 1 A", "c": "Correta: U₂ = 120 × 2500/500; i₂ = 5 × 500/2500. P = 600 W dos dois lados.", "ok": 1}, {"t": "600 V e 25 A", "c": "Errada: a corrente subiu junto com a tensão; fabricou energia."}, {"t": "24 V e 25 A", "c": "Errada: inverteu a razão (é elevador)."}, {"t": "120 V e 5 A", "c": "Errada: o trafo muda a tensão."}, {"t": "600 V e 5 A", "c": "Errada: a potência seria 5 vezes maior que a de entrada."}]}];
const CARDS = [{"id": "kA", "a": "D01", "tp": "Conceito", "f": "Ponto A · linhas de campo são fechadas\n\nAs linhas de campo magnético existem dentro do ímã? Em que sentido elas correm lá dentro, e por que isso é obrigatório?", "v": "Sim, existem. Dentro do ímã correm do <b>sul para o norte</b>. É obrigatório porque as linhas são <b>curvas fechadas</b>: se por fora vão do norte para o sul, alguma coisa tem de fechar o circuito por dentro. E são fechadas porque <b>não existe monopolo magnético</b> — não há polo norte avulso onde uma linha pudesse nascer ou morrer.", "x": "A regra \"do norte para o sul\" só vale <b>com</b> a condição \"por fora\".\n\n<i>Erro a vigiar:</i> aplicar aqui o modelo do campo elétrico, onde as linhas nascem numa carga positiva e morrem numa negativa — porque lá existe carga isolada."}, {"id": "kB", "a": "D01", "tp": "Conceito", "f": "Ponto B · não existe polo isolado\n\nQue fato único está por trás destas duas afirmações: \"um ímã partido em quatro vira quatro ímãs completos\" e \"as linhas de campo magnético são fechadas\"? E qual o nome dele?", "v": "Não existe monopolo magnético — polo norte e polo sul nunca aparecem separados. As duas afirmações são o mesmo fato dito de maneiras diferentes.", "x": "Nome: <b>Lei de Gauss para o magnetismo</b>. Cai com estas palavras: \"as linhas de campo magnético são contínuas, ao contrário das linhas de força do campo elétrico, que se originam em cargas positivas e terminam em cargas negativas\"."}, {"id": "kC", "a": "D02", "tp": "Conceito", "f": "Ponto C · a Terra está invertida\n\nQue tipo de polo magnético fica perto do polo norte <b>geográfico</b> da Terra, e como se chega a isso sem decorar?", "v": "Um polo <b>sul</b> magnético. Raciocínio: a ponta norte da agulha se volta para o norte geográfico; norte só é atraído por sul; logo o que está lá é um polo sul.", "x": "Junto vem a <b>declinação</b>: como os polos magnéticos não coincidem com os geográficos, a agulha não aponta <i>exatamente</i> para o norte verdadeiro — e \"exatamente\" é a palavra que derruba o item."}, {"id": "kD", "a": "D02", "tp": "Conceito", "f": "Ponto D · o que a agulha obedece\n\nUma bússola é posta logo adiante do polo <b>norte</b> de um ímã de barra, sobre o eixo dele. Para onde aponta a ponta norte da agulha, e por quê?", "v": "<b>Para longe do ímã.</b> Ali a linha de campo está saindo do polo norte, apontando para fora, e a agulha se deita sobre a linha que passa nela. Pelo outro caminho dá no mesmo: norte da agulha diante de norte do ímã é repulsão.", "x": "<i>Erro a vigiar:</i> recitar \"opostos se atraem\" sem olhar <b>quais</b> polos estão de frente. A frase está certa; o uso dela, errado."}, {"id": "kE", "a": "D01", "tp": "Conceito", "f": "Ponto E · atraído, repelido, indiferente\n\nO que acontece com uma barra de ferro e com uma de alumínio aproximadas do polo sul de um ímã? E por que o teste de atração não distingue um ímã de uma barra de ferro?", "v": "Ferro: <b>atraído</b> — e seria atraído pelo norte também, porque o polo dele é induzido na hora, sempre na orientação que atrai. Alumínio: <b>nada acontece</b>. Não ser atraído não é ser repelido.", "x": "Ímã e ferro não se distinguem por atração mútua porque o teste é <b>simétrico</b>: o ímã atrai o ferro e o ferro é atraído pelo ímã, dê-se o nome que se der a cada um. Num teste de três barras, identifica-se com certeza só o alumínio — o que não é atraído por ninguém."}, {"id": "kF", "a": "D03", "tp": "Procedimento", "f": "Ponto F · fio desenhado no plano do papel\n\nUm fio retilíneo vertical, contido no plano do papel, conduz corrente de baixo para cima. Num ponto à direita do fio, também no plano do papel, para onde aponta o campo magnético? Cronometre: a meta é responder em menos de 10 segundos.", "v": "<b>Entrando no papel</b> (⊗). À esquerda do fio, sai (⊙).", "x": "Procedimento, sempre na mesma ordem, com a mão de verdade:\n1. Polegar direito ao longo da corrente — aqui, para cima.\n2. Abrace o fio. Os dedos varrem nesta ordem: <b>vindo até você → para a direita → afastando-se de você → para a esquerda</b>.\n3. Veja para onde os dedos estão indo ao passar pelo ponto da questão. À direita do fio eles já estão indo embora de você: entram no papel.\n\n<b>Atalho que corta metade do trabalho:</b> os dois lados do fio têm sempre campos opostos. Acertou um lado, o outro é automático.\n\n<b>Caso-padrão para decorar:</b> corrente para cima, ponto à direita → entra no papel. Toda outra situação é essa girada.\n\n<i>Por que esta é mais difícil que a versão \"fio visto de ponta\":</i> lá o campo está no plano do papel e você só lê o giro. Aqui o fio está no plano do papel e o campo sai dele — exige girar a figura na cabeça. É outra operação mental, e por isso treina separado."}, {"id": "kG", "a": "D03", "tp": "Conceito", "f": "Ponto G · a forma do campo\n\nQual a forma das linhas de campo de um fio retilíneo com corrente, e qual a relação entre o vetor campo e o fio?", "v": "<b>Circunferências concêntricas</b> em torno do fio, num plano perpendicular a ele. O vetor é <b>tangente</b> à circunferência — portanto sempre <b>perpendicular ao fio</b>, e <b>nunca radial</b>.", "x": "<i>Erro a vigiar:</i> desenhar o campo saindo do fio como raio de roda. Isso é o campo <b>elétrico</b> de uma carga. Mesmo tipo de importação indevida que causou o erro das linhas dentro do ímã — ver Ponto A."}, {"id": "kH", "a": "D03", "tp": "Conceito", "f": "Ponto H · direção não é sentido\n\nInvertendo o sentido da corrente num fio, o que acontece com a direção e com o sentido do campo num ponto próximo?", "v": "A <b>direção permanece</b> (continua tangente à mesma circunferência); só o <b>sentido inverte</b> (o giro passa de anti-horário a horário).", "x": "Direção = a reta de suporte. Sentido = para que lado se anda nela. Em português são sinônimos, em física não — e essa distinção vale para o eletromagnetismo inteiro, não só aqui."}, {"id": "kI", "a": "D03", "tp": "Conceito", "f": "Ponto I · circuito deitado na mesa\n\nUm fio é esticado reto sobre uma mesa; depois, dobrado em circunferência sobre a mesma mesa. Nos pontos do plano da mesa, como é o campo nos dois casos — e por quê?", "v": "<b>Vertical nos dois.</b> Como o campo circula em torno do fio, nos pontos que estão no mesmo plano do circuito ele só pode apontar para fora desse plano. Vale para qualquer circuito plano, seja qual for o formato.", "x": ""}, {"id": "kJ", "a": "D05", "tp": "Memória", "f": "Ponto J · quem descobriu o quê\n\nO que Oersted descobriu, em que ano, e qual a descoberta que é o caminho inverso?", "v": "<b>Oersted, 1820:</b> corrente elétrica cria campo magnético. Foi o fim da separação entre eletricidade e magnetismo.", "x": "<b>Caminho inverso — Faraday, cerca de 1830:</b> campo magnético variável cria corrente elétrica (indução).\n\n<i>Erro a vigiar:</i> a banca troca os dois de lugar. \"Oersted descobriu que o campo magnético gera corrente\" é uma afirmação verdadeira na física e falsa como atribuição."}, {"id": "kK", "a": "D04", "tp": "Procedimento", "f": "Ponto K · o teste das três perguntas\n\nQuais são as três perguntas que decidem se há corrente induzida? E quais são as duas coisas que <i>não</i> são pergunta?", "v": "1. <b>Mudou o campo</b> que a espira sente?\n2. <b>Mudou a área</b> dela?\n3. <b>Ela girou</b> (mudou o ângulo)?", "x": "Três nãos, corrente zero. Um sim, há corrente.\n\n<b>O que não é pergunta:</b> se a espira se move, e se existe campo. Nenhum dos dois decide nada.\n\n<i>Os dois erros que isso previne, e que ele cometeu:</i> \"há movimento, logo há corrente\" (espira andando dentro de campo uniforme — nada acontece) e \"há campo, logo há corrente\" (fio com corrente constante ao lado de espira parada — nada acontece).\n\n<i>E o erro oposto, de excesso de correção:</i> \"a espira está parada, logo não há corrente\". Falso — se o campo enfraquece, há corrente com a espira imóvel."}, {"id": "kL", "a": "D04", "tp": "Conceito", "f": "Ponto L · as cenas que enganam\n\nEm cada uma destas, há corrente induzida? (a) espira atravessa uma região de campo uniforme, entrando e saindo; (b) espira e ímã se movem juntos, lado a lado; (c) espira parada e o campo da região enfraquecendo.", "v": "(a) <b>Só na entrada e na saída.</b> Inteiramente dentro, o fluxo trava no máximo e não há corrente, apesar do movimento.", "x": "(b) <b>Não.</b> O que importa é o movimento <i>relativo</i> entre ímã e espira. Viajando juntos, da perspectiva da espira o ímã está parado ao lado.\n\n(c) <b>Sim.</b> A espira não precisa se mexer: quem variou foi o campo."}, {"id": "kM", "a": "D04", "tp": "Memória", "f": "Ponto M · reconhecer o aparelho\n\nEm cada um, o que varia e onde aparece a corrente: fogão de indução, carregador sem fio, etiqueta RFID, microfone, gerador. E qual destes <i>não</i> é indução: guindaste eletroímã, campainha, chave magnética?", "v": "Fogão: campo da bobina varia → corrente no fundo da panela, que esquenta por Joule. Carregador: campo da bobina do carregador → corrente na bobina do celular. RFID: campo do leitor → corrente na bobina da etiqueta, que por isso não tem pilha. Microfone: a bobina vibra perto do ímã → corrente nela mesma. Gerador: a bobina gira no campo → corrente nos terminais.", "x": "<b>Nenhum dos três últimos é indução.</b> Guindaste, campainha e chave magnética são <b>eletroímã</b>: ali a corrente é a <i>causa</i> e o campo é o <i>efeito</i>. Na indução é o contrário. Teste: pergunte quem veio primeiro."}, {"id": "kN", "a": "D05", "tp": "Memória", "f": "Ponto N · quem cria o quê\n\nComplete as quatro linhas da tabela: carga parada cria ___; carga em movimento (corrente) cria ___; campo magnético <b>variável</b> cria ___; campo elétrico <b>variável</b> cria ___. E a quem se atribui cada uma.", "v": "1. Carga parada → <b>campo elétrico</b>. (Gauss / Coulomb)\n2. Corrente → <b>campo magnético</b>. (<b>Oersted</b>, 1820; formalizado por Ampère)\n3. Campo magnético variável → <b>campo elétrico</b>, logo corrente induzida. (<b>Faraday</b>, ~1830; o sentido é de <b>Lenz</b>)\n4. Campo elétrico variável → <b>campo magnético</b>. (<b>Maxwell</b> — foi a peça que faltava, e é dele a adição)", "x": "A linha 4 é a que fecha o ciclo: com ela os dois campos passam a poder se sustentar mutuamente no vácuo, e isso é a onda eletromagnética. A luz deixou de ser um assunto separado.\n\n<i>Erro a vigiar:</i> a banca troca os nomes das linhas 2 e\n3. Ver Ponto J."}, {"id": "kO", "a": "D05", "tp": "Conceito", "f": "Ponto O · a geometria da onda\n\nNuma onda eletromagnética, qual o ângulo entre o campo elétrico, o campo magnético e a direção de propagação? Ela precisa de meio material? E o que distingue uma onda de rádio de um raio X?", "v": "Os três são <b>mutuamente perpendiculares</b>: E ⟂ B, e ambos ⟂ à propagação. Por isso é onda <b>transversal</b>.", "x": "<b>Não precisa de meio</b> — propaga-se no vácuo, a c ≈ 3×10⁸ m/s. É o que separa onda eletromagnética de onda mecânica (som precisa de meio).\n\nRádio, micro-ondas, infravermelho, luz visível, ultravioleta, raio X e gama são <b>a mesma onda</b>, diferindo só em frequência e comprimento de onda. Todas andam com a mesma velocidade no vácuo.\n\n<i>Erro a vigiar:</i> dizer que E e B oscilam no mesmo plano, ou que a frequência muda a velocidade no vácuo."}, {"id": "kP", "a": "D04", "tp": "Procedimento", "f": "Ponto P · separar as três confusões do grupo\n\nDiante de uma questão com bobina, como decidir em 10 segundos se ela é de <b>eletroímã</b>, de <b>indução</b> ou de <b>Oersted</b>? E qual o teste que separa \"tem campo / tem movimento\" de \"tem corrente\"?", "v": "<b>Pergunte quem é a causa.</b> - Corrente é a causa e o campo é o efeito → <b>eletroímã</b> (guindaste, campainha, chave magnética, fechadura elétrica, alto-falante). - Campo que <b>varia</b> é a causa e a corrente é o efeito → <b>indução</b> (fogão, carregador sem fio, RFID, microfone, gerador). - A questão só quer a <b>forma ou o sentido</b> do campo de um fio, sem bobina nem variação → <b>Oersted</b>.", "x": "<b>O teste de presença:</b> nem campo nem movimento decidem nada. Só a <i>variação do fluxo</i> decide. Três perguntas — mudou o campo, mudou a área, girou? Ver Ponto K.\n\n<i>A armadilha reaparecerá:</i> carga <b>parada</b> num campo magnético não sofre força. É a mesma forma de erro — presença não é efeito — na dinâmica de força magnética."}, {"id": "kQ", "a": "D06", "tp": "Procedimento", "f": "Ponto Q · a regra do tapa, em cinco passos\n\nRecite os cinco passos da regra da mão direita espalmada. Depois responda, cronometrando 10 segundos: elétron indo <b>para a direita</b>, campo <b>saindo do papel</b> (⊙) — para onde aponta a força?", "v": "1. Mão <b>direita</b> espalmada, dedos juntos.\n2. <b>Polegar</b> = sentido de <b>v</b>.\n3. <b>Quatro dedos</b> = sentido de <b>B</b>.\n4. A <b>palma empurra</b> = sentido de <b>F</b>, para carga <b>positiva</b>.\n5. Carga <b>negativa</b>: o resultado é o <b>oposto</b> do que a palma diz.", "x": "Resposta do caso: <b>para cima</b>. A palma dá \"para baixo\"; o elétron é negativo, inverte.\n\n<i>O passo que se perde é sempre o 5.</i> A banca enche os enunciados de elétron, partícula beta e íon negativo exatamente por isso. Antes de marcar, reler o enunciado procurando uma única coisa: o sinal da carga.\n\n<i>Caso-padrão para ancorar:</i> próton para a direita, campo ⊗ → força <b>para cima</b>. Toda outra situação é essa girada ou invertida."}, {"id": "kR", "a": "D06", "tp": "Conceito", "f": "Ponto R · os três zeros e o que a força nunca faz\n\nQuais são os três casos em que a força magnética sobre uma partícula é nula? E por que uma carga em órbita circular dentro de um campo não ganha nem perde energia?", "v": "<b>Os três zeros:</b> (1) carga <b>parada</b>; (2) <b>v paralela a B</b> — mesmo sentido ou oposto, tanto faz; (3) partícula <b>neutra</b>.", "x": "<b>A energia:</b> F é sempre perpendicular a v, logo perpendicular ao deslocamento, logo <b>não realiza trabalho</b>. Sem trabalho, a energia cinética não muda — e como a massa é a mesma, a <b>rapidez não muda</b>. Só a direção muda, o tempo todo. Força de módulo constante sempre perpendicular ao movimento é a receita do <b>movimento circular uniforme</b>, e é daí que virão o raio e o período no grupo de cálculo.\n\n<i>Erro a vigiar:</i> \"tem campo e tem movimento, logo tem força\" — a mesma forma do erro de indução. Ver Pontos K e P."}, {"id": "kS", "a": "D07", "tp": "Procedimento", "f": "Ponto S · o polegar mudou de dono\n\nO que muda na regra da mão direita quando a questão fala de um fio com corrente em vez de uma carga em movimento? E o que acontece se o enunciado avisar que quem anda de fato são os elétrons?", "v": "Muda <b>uma coisa só</b>: o polegar aponta o sentido da <b>corrente</b> em vez da velocidade. Dedos no campo, a palma empurra, igual a sempre.", "x": "Se o enunciado fala em elétrons andando para a esquerda, <b>nada muda</b> — o sentido convencional da corrente já é o dos positivos, então elétron para a esquerda <i>é</i> corrente para a direita. O passo 5 <b>não existe</b> aqui: a resposta da palma é final.\n\n<i>Caso-padrão:</i> corrente para a direita, campo ⊗ → fio empurrado <b>para cima</b>.\n\n<i>Erro a vigiar:</i> inverter a resposta por ver a palavra \"elétron\" no enunciado. É aplicar na dinâmica 7 a armadilha nº 1 da dinâmica 6."}, {"id": "kT", "a": "D07", "tp": "Conceito", "f": "Ponto T · a espira que gira sem sair do lugar\n\nPor que uma espira com corrente dentro de um campo uniforme gira em vez de se deslocar? Qual é a função do comutador num motor? E o que separa motor de gerador, se o desenho é o mesmo?", "v": "Nos dois lados opostos a corrente corre em sentidos contrários, então as forças são contrárias: a <b>resultante é nula</b> (não translada), mas estão aplicadas em <b>pontos diferentes</b>, e um par assim produz <b>rotação</b>.", "x": "<b>Comutador</b> (anel partido): inverte a corrente a cada meia volta. Sem ele, passada a meia volta o par de forças passaria a frear a espira, que pararia balançando.\n\n<b>Motor</b> — corrente é causa, giro é efeito. <b>Gerador</b> — giro é causa, corrente é efeito (é indução). Separa-se pela pergunta do Ponto P: quem veio primeiro?\n\n<i>Erro a vigiar:</i> ler \"resultante nula\" como \"nada acontece\"."}, {"id": "kU", "a": "D07", "tp": "Conceito", "f": "Ponto U · os três botões de F = B·i·L\n\nDobrando a corrente e dobrando o comprimento de fio dentro do campo, o que acontece com a força? Qual é a condição para a fórmula valer nessa forma, e que comprimento é esse <i>L</i>?", "v": "A força fica <b>quádrupla</b> — os três fatores se multiplicam, então 2 × 2.", "x": "Vale para fio <b>perpendicular</b> ao campo. Com ângulo, entra o seno, e isso é outra dinâmica.\n\n<i>L</i> é o comprimento de fio <b>dentro</b> do campo, nunca o comprimento do fio inteiro.\n\n<i>Erro a vigiar:</i> achar que campo intenso garante força. Zerar qualquer um dos três botões zera a força — chave aberta é F = 0, por mais intenso que seja B."}, {"id": "kV", "a": "D08", "tp": "Conceito", "f": "Ponto V · o argumento que dispensa decorar\n\nSem usar a palavra \"Lenz\", explique por que uma espira <i>obrigatoriamente</i> repele o ímã que se aproxima. E por que a manivela de um gerador fica mais pesada quando se acendem mais lâmpadas?", "v": "Se atraísse, o ímã seria puxado, aceleraria sozinho, o fluxo variaria mais rápido, a corrente aumentaria, a atração aumentaria — uma máquina que ganha velocidade sozinha <i>enquanto</i> acende uma lâmpada. <b>Energia do nada.</b> Como o universo não permite, só sobra a repulsão.", "x": "A manivela é o mesmo fato pelo lado de dentro: a energia elétrica que sai do fio é a energia mecânica que entra no braço. Mais lâmpadas, mais energia por segundo, manivela mais pesada. Em escala de usina: mais consumo, mais água na turbina.\n\n<b>A lei:</b> a corrente induzida sempre se opõe à variação que a criou."}, {"id": "kW", "a": "D08", "tp": "Procedimento", "f": "Ponto W · chegou repele, saiu atrai\n\nRecite os três passos que dão o sentido da corrente induzida. Depois responda, cronometrando: polo <b>sul</b> se <b>afastando</b> de uma espira — que polo vira a face voltada para ele, há atração ou repulsão, e em que sentido corre a corrente vista desse lado?", "v": "1. Chegando ou indo embora? (ou: o campo cresce ou diminui?)\n2. Chegando → a face vira o <b>mesmo</b> polo e repele. Indo embora → vira o <b>oposto</b> e atrai.\n3. Mão direita, dedos no sentido da corrente, <b>polegar aponta o norte</b>. Visto de frente: face norte → <b>anti-horária</b>; face sul → <b>horária</b>.", "x": "Resposta do caso: sul se afastando → a face vira <b>norte</b>, há <b>atração</b>, e a corrente é <b>anti-horária</b> vista de lá.\n\n<i>Erro a vigiar:</i> decorar \"a espira repele\". Ela se opõe à <b>variação</b>, não ao ímã. O passo que se perde é o 3 — é o único realmente novo desta dinâmica."}, {"id": "kX", "a": "D08", "tp": "Memória", "f": "Ponto X · as cenas sem contato\n\nExplique por Lenz: o ímã que desce devagar num tubo de cobre e rápido num de PVC; o freio eletromagnético de trem; o anel que salta quando a chave do eletroímã é fechada. E por que o cobre freia o ímã se cobre não é atraído por ímã?", "v": "<b>Tubo de cobre:</b> o ímã caindo faz o fluxo variar em cada anel do tubo; as correntes induzidas se opõem à variação, isto é, à queda. A energia potencial vira calor no cobre em vez de velocidade. <b>PVC não conduz</b>, então nada se induz e a queda é livre.", "x": "<b>Freio eletromagnético:</b> induz-se corrente na roda, e ela se opõe ao giro que a criou. Freia sem encostar e sem desgastar.\n\n<b>Anel saltante:</b> chave fechada, campo cresce, corrente induzida no anel cria campo contrário, e os dois se repelem.\n\n<b>Por que o cobre freia sem ser magnético:</b> indução não precisa de material magnético, só de material <b>condutor</b>. Ser atraído por ímã e conduzir corrente são propriedades diferentes."}, {"id": "kY", "a": "D09", "tp": "Procedimento", "f": "Ponto Y · altura não é inclinação\n\nNum gráfico de fluxo contra tempo, o que significam: reta horizontal no alto do gráfico; trecho mais inclinado que outro; um trecho que sobe e outro que desce com a mesma inclinação; um bico na linha?", "v": "<b>Horizontal</b> (por mais alto que esteja): fem <b>zero</b> — nada varia. <b>Mais inclinado:</b> fem <b>maior</b> ali. <b>Sobe × desce com a mesma inclinação:</b> mesma fem em tamanho, corrente de <b>sentido oposto</b>. <b>Bico:</b> a corrente <b>inverte</b> naquele instante.", "x": "A chave: <b>altura é fluxo, inclinação é fem.</b> Faraday diz que importa a <i>rapidez</i> da variação, e rapidez de variação num gráfico é inclinação.\n\n<i>Erro a vigiar:</i> \"a fem é maior onde o gráfico está mais alto\". É a alternativa mais marcada da dinâmica, e é o Ponto K desenhado — presença não é efeito.\n\n<i>Antes de responder qualquer gráfico:</i> leia os dois eixos em voz alta."}, {"id": "kZ", "a": "D09", "tp": "Conceito", "f": "Ponto Z · as três formas\n\nQue forma tem cada gráfico, e por quê: raio da órbita × velocidade; período × velocidade; campo de um fio × distância?", "v": "<b>Raio × velocidade — reta pela origem.</b> Mais rápida, curva mais <b>aberta</b>, na mesma proporção. (Carro numa curva: mesmo asfalto, mais velocidade, ele abre a curva.) Nasce na origem porque sem velocidade não há curva.", "x": "<b>Período × velocidade — reta horizontal.</b> Círculo maior percorrido mais depressa dá o <b>mesmo tempo</b> de volta. Os dois efeitos se cancelam exatamente.\n\n<b>Campo × distância — curva que despenca.</b> Dobrou a distância, o campo caiu à metade; vai se achatando e <b>nunca chega a zero</b>.\n\n<i>Erro a vigiar 1:</i> \"rápido curva mais fechado\" — é o contrário, e foi o único erro dele na aula. <i>Erro a vigiar 2:</i> trocar a curva que despenca por uma reta descendo, que ainda faria o campo virar negativo."}, {"id": "kAA", "a": "D06", "tp": "Procedimento", "f": "Ponto AA · separar as quatro do Grupo 2\n\nDiante de uma figura com campo magnético, como decidir em 15 segundos se a questão é de <b>força sobre carga</b>, <b>força sobre fio</b>, <b>Lenz</b> ou <b>gráfico</b>? E qual é o par que usa o mesmo desenho para perguntar coisas opostas?", "v": "<b>Conte os elementos e procure o verbo.</b> - Há uma <b>partícula</b> com velocidade e sinal → força sobre carga. (Procurar o sinal antes de marcar.) - Há um <b>fio ou espira com corrente</b> dentro de campo externo → força sobre fio. (Não procurar sinal: corrente é convencionada nos positivos.) - Algo <b>aproxima, afasta, cresce, diminui, freia, pesa ou salta</b> → Lenz. - Há <b>eixos desenhados</b> → gráfico. Leia os dois eixos antes de pensar.", "x": "<b>O par que engana:</b> <i>fio com corrente</i>. Se há <b>só o fio</b>, a pergunta é o campo que ele <b>cria</b> (Oersted). Se há o fio <b>e um campo externo</b>, é a força que ele <b>sofre</b>. Teste: procure um segundo campo no enunciado.\n\n<b>A segunda confusão:</b> <i>motor × gerador</i>, mesmo desenho. Corrente é causa → motor. Giro é causa → gerador. É o Ponto P aplicado ao Grupo 2."}, {"id": "kAB", "a": "D11", "tp": "Procedimento", "f": "Ponto AB · o campo dos dois lados de um fio\n\nDois fios paralelos atravessam o papel com correntes iguais e no mesmo sentido. Por que o campo no ponto médio entre eles é nulo, e por que deixa de ser se uma das correntes inverter?", "v": "O campo de um fio aponta para <b>um lado de um lado dele e para o lado oposto do outro lado</b> (as linhas são circunferências em volta do fio). O ponto médio fica à direita de um fio e à esquerda do outro: com correntes no mesmo sentido, os dois campos ali apontam para lados opostos; com distâncias iguais e correntes iguais, têm o mesmo módulo e se anulam.", "x": "Invertendo uma corrente, o campo dela vira em todo lugar: entre os fios os dois passam a apontar para o mesmo lado e <b>somam</b>. O meio vira o ponto mais forte.\n\n<i>Erro a vigiar:</i> tentar enxergar sem fazer a mão para cada fio separadamente. Bancada: aula 0019, seção 3, \"dois fios vistos de cima\"."}, {"id": "kAC", "a": "D11", "tp": "Procedimento", "f": "Ponto AC · onde procurar o nulo\n\nDois fios paralelos. Em que região da reta entre eles pode haver campo nulo quando as correntes têm o mesmo sentido? E quando têm sentidos opostos? Como se monta a equação em cada caso?", "v": "Mesmo sentido: <b>entre</b> os fios; i₁ ÷ x = i₂ ÷ (D − x). Sentidos opostos: <b>fora</b>, do lado do mais fraco; i₁ ÷ x = i₂ ÷ (x + D). Correntes iguais e opostas: nulo nenhum. O ponto fica sempre perto do fio de corrente menor.", "x": ""}, {"id": "kAD", "a": "D10", "tp": "Conceito", "f": "Ponto AD · o interior do solenoide\n\nComo é o campo dentro de um solenoide longo, e com o que ele se parece?", "v": "Uniforme e paralelo ao eixo; quase nulo fora. Um ímã de barra feito de corrente.", "x": ""}, {"id": "kAE", "a": "D14", "tp": "Conceito", "f": "Ponto AE · o período não depende da velocidade\n\nUma carga faz meia volta num campo e sai em 40 ns. Lançada de novo com o triplo da velocidade — ou com o dobro da energia —, quanto tempo ela fica na região? Por que, se ela está mais rápida?", "v": "<b>O mesmo tempo.</b> T = 2πm ÷ (qB): só massa, carga e campo. Nem v nem energia aparecem.", "x": "O motivo em uma frase: velocidade maior faz o <b>raio</b> crescer na mesma proporção (R = mv ÷ qB), então o círculo fica maior exatamente o quanto é percorrido mais depressa. As duas mudanças se cancelam.\n\n<i>Variantes de prova:</i> IAUPE CBM PE 2018 (meia volta, energia dobrada → mesmo tempo) e qualquer questão que ofereça \"o triplo\" e \"um terço\" como iscas — uma para cada intuição errada.\n\n<i>Não confundir:</i> o que <b>muda</b> com v é o raio e a distância percorrida (AOCP 2024 Aspirante: distância em n voltas = n · 2πR). O tempo é que não muda."}, {"id": "kAF", "a": "D15", "tp": "Procedimento", "f": "Ponto AF · o que o seletor ignora\n\nNum seletor de velocidades, qual é a velocidade que passa sem desviar, e de que grandezas ela <b>não</b> depende? E o que acontece com uma partícula mais rápida que essa?", "v": "Equilíbrio: qE = qvB → <b>v = E ÷ B</b>. O q corta dos dois lados, e a massa nunca entrou: a velocidade selecionada <b>não depende da carga nem da massa</b>. Seleciona velocidade, não partícula.", "x": "Mais rápida que E/B: a força elétrica qE não depende de v, mas a magnética qvB cresce com v — então a <b>magnética ganha</b> e a partícula desvia para o lado dela. Mais devagar, desvia para o lado da elétrica.\n\n<i>Erro a vigiar:</i> escrever B ÷ E (a fórmula de cabeça para baixo). Confira a ordem de grandeza: v = E/B costuma dar 10⁵–10⁶ m/s, não 10⁻⁶."}, {"id": "k12a", "a": "D12", "tp": "Recuperação", "f": "Dois fios paralelos com correntes no mesmo sentido: atraem ou repelem? E com correntes opostas?", "v": "Mesmo sentido: <b>atraem</b>. Opostos: <b>repelem</b>.", "x": "É o contrário das cargas elétricas. Cada fio está no campo do outro, e a força sobre fio com corrente paralela aponta para o vizinho."}, {"id": "k12b", "a": "D12", "tp": "Diagnóstico", "f": "Localize o erro: “o fio de 6 A puxa o de 2 A com força três vezes maior do que a que sofre”.", "v": "As duas forças são <b>iguais</b> (ação e reação).", "x": "F = μ₀ i₁ i₂ L/(2πd) tem o produto i₁·i₂: o mesmo número para os dois fios. FICSAE 2017: razão 1."}, {"id": "k13a", "a": "D13", "tp": "Cloze", "f": "F = q · v · B · ______, com o ângulo entre ______ e ______.", "v": "sen θ · a velocidade · o campo", "x": "Seno porque só o pedaço da velocidade perpendicular ao campo gera força. θ = 0° → zero; θ = 90° → máximo."}, {"id": "k13b", "a": "D13", "tp": "Procedimento", "f": "Uma questão dá sen θ = 0,6 e cos θ = 0,8 e pede a força magnética. Qual dos dois entra, e por quê a banca deu os dois?", "v": "Entra o <b>seno</b> (0,6).", "x": "A banca dá os dois para ver se você escolhe. O cosseno só entra no fluxo, onde o ângulo é com a normal da espira."}, {"id": "k16a", "a": "D16", "tp": "Diagnóstico", "f": "“A espira está perpendicular às linhas de campo, logo o fluxo é zero.” Certo ou errado, e por quê?", "v": "<b>Errado</b>: é fluxo máximo.", "x": "“Perpendicular” descreve o plano da espira, que corta o campo de frente. A normal fica alinhada: cos 0° = 1. Zero é com o campo deitado no plano."}, {"id": "k16b", "a": "D16", "tp": "Procedimento", "f": "Quadrado de 2 cm de lado: qual a área em m², e qual é o fator de conversão de cm² para m²?", "v": "4 × 10⁻⁴ m². Fator <b>10⁻⁴</b>.", "x": "O lado ganha 10⁻², a área ganha 10⁻⁴. Pegadinha das duas questões do CBM DF 2017."}, {"id": "k17a", "a": "D17", "tp": "Recuperação", "f": "Escreva a cadeia completa de Faraday com número, do fluxo à corrente.", "v": "Φ = B·A·cos θ → ε = N·ΔΦ/Δt → i = ε/R", "x": "Barra deslizante: ε = B·L·v (é o mesmo, com a área variando). Confira: contou o N? Converteu ms para s?"}, {"id": "k17b", "a": "D17", "tp": "Procedimento", "f": "“O campo diminui 4 T/s numa espira de 1 m².” Quanto vale a fem, e qual a armadilha?", "v": "ε = A · ΔB/Δt = 1 × 4 = <b>4 V</b>.", "x": "A taxa já veio pronta: não procure Δt. Quem procura o tempo que não existe trava (CBM DF 2017)."}, {"id": "k18a", "a": "D18", "tp": "Recuperação", "f": "Num transformador ideal, o que é igual nos dois enrolamentos? E qual a razão entre as tensões?", "v": "A <b>potência</b>: P₁ = P₂. U₁/U₂ = N₁/N₂.", "x": "Tensão sobe na mesma proporção em que a corrente desce. Quem faz as duas subirem está fabricando energia."}, {"id": "k18b", "a": "D18", "tp": "Diagnóstico", "f": "Um aluno liga o primário de um transformador numa pilha de 1,5 V. O que mede no secundário, em regime?", "v": "<b>Zero</b>.", "x": "Corrente contínua não faz o fluxo variar. Sem variação, sem indução."}, {"id": "k10a", "a": "D10", "tp": "Recuperação", "f": "Campo de um fio, no centro de uma espira e dentro de um solenoide: as três fórmulas.", "v": "Fio μ₀i/(2πd) · espira μ₀i/(2R) · solenoide μ₀·n·i", "x": "A espira não tem π no denominador. O solenoide é uniforme por dentro. Para proporção, nem precisa de μ₀: fator de i ÷ fator da distância."}];
const MICRO = [{"id": "mc1", "tit": "D1 · Ímãs", "al": ["D01"], "art": 1, "diz": "Dois polos inseparáveis; mesmo nome repele; linhas fechadas (fora N→S, dentro S→N). Ferro é atraído por qualquer polo; alumínio, por nenhum.", "pq": "Não existe monopolo magnético. Por isso o ímã partido vira dois ímãs inteiros, e as linhas não têm onde nascer ou morrer.", "banca": "Troca “não é atraído” por “é repelido”; diz que o ímã partido dá polos isolados.", "caso": "Teste das três barras: só o alumínio se identifica com certeza."}, {"id": "mc2", "tit": "D2 · Bússola e campo terrestre", "al": ["D02"], "art": 2, "diz": "A agulha se alinha à linha de campo local. Perto do norte geográfico há um sul magnético. Declinação (horizontal) e inclinação (vertical: 0 no equador, ~90° nos polos).", "pq": "A ponta norte é atraída para o norte geográfico; só sul atrai norte. E a agulha obedece ao campo que existe ali, seja da Terra, de um ímã ou de um fio.", "banca": "Usa “exatamente” (declinação derruba) e mistura declinação com inclinação.", "caso": "Cortiça com agulha + ímã aproximado: a agulha passa a seguir o campo do ímã."}, {"id": "mc3", "tit": "D3 · Oersted", "al": ["D03"], "art": 3, "diz": "Corrente cria campo. Fio reto: circunferências em plano perpendicular; polegar direito na corrente. Bobina + ferro = eletroímã.", "pq": "Carga em movimento é fonte de campo magnético; carga parada não.", "banca": "Diz que as linhas são paralelas ao fio, ou que a bússola se alinha paralela ao fio.", "caso": "Fio vertical no papel, corrente para cima: à direita entra (⊗), à esquerda sai (⊙)."}, {"id": "mc4", "tit": "D4 · Indução no cotidiano", "al": ["D04"], "art": 4, "diz": "Corrente induzida só existe enquanto o fluxo varia. Gerador, fogão de indução, carregador sem fio, RFID, microfone, detector de metais, transformador.", "pq": "O que induz é a mudança, não a presença do campo. Ímã parado na bobina não faz nada.", "banca": "Coloca “ímã parado” ou “corrente contínua constante” induzindo corrente.", "caso": "Fogão de indução: o campo variável induz correntes no fundo da panela, que esquenta por Joule."}, {"id": "mc5", "tit": "D5 · Maxwell e história", "al": ["D05"], "art": 5, "diz": "Quatro equações; previsão de ondas eletromagnéticas à velocidade da luz; luz é onda EM transversal; Hertz confirmou.", "pq": "A variação de B cria E (Faraday) e a variação de E cria B (Maxwell): um sustenta o outro e a perturbação viaja sozinha.", "banca": "Troca os nomes: atribui a Maxwell a descoberta de Oersted ou de Faraday.", "caso": "Linha do tempo: Oersted 1820 → Faraday 1831 → Maxwell 1864 → Hertz 1887."}, {"id": "mc6", "tit": "D6 · Força sobre carga", "al": ["D06"], "art": 6, "diz": "F ⟂ v e F ⟂ B. Regra do tapa para positiva; negativa inverte. Zeros: parada, paralela, sem campo.", "pq": "Por ser sempre perpendicular à velocidade, a força só curva a trajetória: trabalho nulo, energia cinética constante.", "banca": "Diz que a força acelera a carga ou que a paralela é desviada.", "caso": "Elétron para a direita, campo entrando: força para baixo."}, {"id": "mc7", "tit": "D7 · Força sobre fio e motor", "al": ["D07"], "art": 7, "diz": "F = B·i·L·sen θ. Polegar na corrente. Espira com corrente no campo gira: motor.", "pq": "Corrente é carga em movimento; a força sobre o fio é a soma das forças sobre as cargas.", "banca": "Põe força máxima com o fio paralelo ao campo; esquece que inverter a corrente inverte o giro.", "caso": "Motor homopolar (UnB 2016): força linear com a corrente; some se i = 0 ou se B for paralelo ao movimento dos elétrons."}, {"id": "mc8", "tit": "D8 · Lenz", "al": ["D08"], "art": 8, "diz": "A corrente induzida se opõe à variação do fluxo. Chegou repele, saiu atrai.", "pq": "Se ajudasse a variação, a energia apareceria do nada. A oposição é a conservação de energia.", "banca": "Escreve “se opõe ao fluxo” em vez de “à variação do fluxo”.", "caso": "Norte se aproxima: a face vira norte e repele. Norte se afasta: a face vira sul e atrai."}, {"id": "mc9", "tit": "D9 · Gráficos", "al": ["D09"], "art": 9, "diz": "Φ × t: fem = inclinação. R × v: reta pela origem. T × v: horizontal. B × d: hipérbole.", "pq": "Fórmula vira forma: proporcional dá reta pela origem; independente dá horizontal; inverso dá hipérbole.", "banca": "Confunde altura com inclinação: diz que fluxo máximo dá fem máxima.", "caso": "Trecho horizontal do Φ × t: fem zero, mesmo que o fluxo seja enorme."}, {"id": "mc10", "tit": "D10 · Campo criado", "al": ["D10"], "art": 10, "diz": "Fio μ₀i/(2πd) · espira μ₀i/(2R) (× N) · solenoide μ₀ni, uniforme dentro.", "pq": "B cresce com a corrente e cai com a distância. No solenoide, as espiras somam dentro e se cancelam fora.", "banca": "Usa 2πR na espira; diz que o campo do solenoide é mais forte junto às espiras.", "caso": "CBM DF 2017: i +50% e raio ÷ 4 → B × 1,5 × 4 = 6B."}, {"id": "mc11", "tit": "D11 · Superposição e campo nulo", "al": ["D11"], "art": 11, "diz": "Some vetores. Mesmo sentido: nulo entre os fios. Opostos: nulo fora. Sempre perto do mais fraco.", "pq": "O campo de um fio aponta para lados opostos dos dois lados dele: entre dois fios de mesmo sentido, um aponta para cada lado.", "banca": "Coloca o nulo no meio com correntes diferentes, ou entre fios com correntes opostas.", "caso": "IAUPE CBM PE 2007: duas espiras concêntricas, campo resultante no centro = diferença ou soma, conforme o sentido."}, {"id": "mc12", "tit": "D12 · Fios paralelos", "al": ["D12"], "art": 12, "diz": "Mesmo sentido atrai, opostos repelem. F = μ₀ i₁ i₂ L/(2πd). Forças iguais nos dois fios.", "pq": "Cada fio está no campo do outro; a regra da força sobre fio dá atração para correntes paralelas.", "banca": "Usa a intuição elétrica (igual repele) ou dá forças diferentes para correntes diferentes.", "caso": "FICSAE 2017: 2 A e 6 A opostos → razão 1, repulsiva."}, {"id": "mc13", "tit": "D13 · Força com ângulo", "al": ["D13"], "art": 13, "diz": "F = q·v·B·sen θ, com θ entre v e B.", "pq": "Só a componente da velocidade perpendicular ao campo produz força.", "banca": "Dá sen e cos juntos; esconde μC e mC para testar potência de 10.", "caso": "FMO 2019: dado F, achar o ângulo — sen α = 0,6."}, {"id": "mc14", "tit": "D14 · Carga em círculo", "al": ["D14"], "art": 14, "diz": "R = mv/(qB); T = 2πm/(qB); distância em n voltas = n·2πR.", "pq": "Velocidade maior → raio maior na mesma proporção → a volta demora o mesmo.", "banca": "Oferece “o dobro do tempo” quando a energia dobra; usa R como distância percorrida.", "caso": "AOCP CBM PE 2024 Asp: elétron, 3 voltas, distância = 3 · 2πR."}, {"id": "mc15", "tit": "D15 · Seletor", "al": ["D15"], "art": 15, "diz": "qE = qvB → v = E/B. Não depende de q nem de m.", "pq": "A elétrica não depende de v; a magnética cresce com v. Só uma velocidade empata.", "banca": "Escreve B/E; diz que depende da massa.", "caso": "AOCP CBM PA 2022: íons positivos, E em +y, B em +z → v = E/B."}, {"id": "mc16", "tit": "D16 · Fluxo", "al": ["D16"], "art": 16, "diz": "Φ = B·A·cos θ, θ com a normal. Wb = T·m².", "pq": "Fluxo mede quantas linhas atravessam o aro: é a “sombra” que a espira projeta.", "banca": "“Espira perpendicular ao campo” para induzir fluxo zero; área em cm².", "caso": "CBM DF 2017: quadrado de 2 cm, 2 T → 8 × 10⁻⁴ Wb."}, {"id": "mc17", "tit": "D17 · Faraday com número", "al": ["D17"], "art": 17, "diz": "ε = N·ΔΦ/Δt → i = ε/R. Barra: ε = B·L·v.", "pq": "O que gera tensão é a pressa da variação. Cada volta contribui com a sua.", "banca": "Esquece o N; divide por ms sem converter; para no ε quando pedem i.", "caso": "CBM DF 2017: campo cai 4 T/s em 1 m², i = 1/3 A → ε = 4 V, R = 12 Ω."}, {"id": "mc18", "tit": "D18 · Transformador", "al": ["D18"], "art": 18, "diz": "P₁ = P₂; U₁/U₂ = N₁/N₂ = i₂/i₁. Só com corrente alternada.", "pq": "Sem perdas, a energia que entra sai. Troca-se tensão por corrente.", "banca": "Faz a corrente subir junto com a tensão; liga o trafo em corrente contínua.", "caso": "UERJ 2015: 100 W, 5 V, aparelhos de 0,1 A em paralelo → 200."}];

o", "a": "fio μ₀i/2πd · espira μ₀i/2R · solenoide μ₀ni", "q": "Fórmula da espira?", "al": "D10", "w": "Espira: 2R, sem π.", "art": 10}, {"id": "n3b", "t": "D11 · Superposição", "a": "mesmo sentido: nulo entre · opostos: fora", "q": "Onde fica o nulo com correntes no mesmo sentido?", "al": "D11", "w": "Perto do mais fraco.", "art": 11}, {"id": "n3c", "t": "D12 · Fios paralelos", "a": "igual atrai · opostos repelem", "q": "Correntes no mesmo sentido: atraem ou repelem?", "al": "D12", "w": "Forças iguais nos dois fios.", "art": 12}, {"id": "n3d", "t": "D13 · Força com ângulo", "a": "q·v·B·sen θ", "q": "Seno ou cosseno?", "al": "D13", "art": 13}, {"id": "n3e", "t": "D14 · Carga em círculo", "a": "R = mv/qB · T = 2πm/qB", "q": "O período depende de v?", "al": "D14", "w": "Não depende.", "art": 14}, {"id": "n3f", "t": "D15 · Seletor", "a": "v = E/B", "q": "Depende da massa?", "al": "D15", "w": "Nem da massa nem da carga.", "art": 15}], "c": "exe"}, {"id": "n4", "t": "Família III · indução com número", "a": "D16 a D18", "q": "Fluxo, fem e transformador?", "k": [{"id": "n4a", "t": "D16 · Fluxo", "a": "Φ = B·A·cos θ (normal)", "q": "Espira perpendicular ao campo: fluxo?", "al": "D16", "w": "Máximo, não zero.", "art": 16}, {"id": "n4b", "t": "D17 · Faraday", "a": "ε = N·ΔΦ/Δt · i = ε/R · B·L·v", "q": "Fórmula da fem?", "al": "D17", "w": "Não esqueça o N.", "art": 17}, {"id": "n4c", "t": "D18 · Transformador", "a": "P₁ = P₂ · U₁/U₂ = N₁/N₂", "q": "Tensão sobe: e a corrente?", "al": "D18", "w": "Desce. Só com alternada.", "art": 18}], "c": "neu"}]};

function newSession(mode) { return { mode: mode || "Estudo", start: new Date().toISOString(), res: [] }; }

function record(kind, id, alvo, score) {
  if (!alvo) return;
  S.cur.res.push({ k: kind, id, a: alvo, s: score });
  const L = S.life[alvo] || (S.life[alvo] = { n: 0, s: 0 });
  L.n++; L.s += score;
  if (score < 1) {
    const e = S.errors[id] || (S.errors[id] = { id, k: kind, a: alvo, n: 0 });
    e.n++; e.last = today(); e.lastOk = false;
  } else if (S.errors[id]) { S.errors[id].lastOk = true; }
  save();
}

const omRe = /\{\{([^|}]+)\|([A-Z]\d\d)\}\}/g;
const plain = t => t.replace(omRe, "$1");
function leiHTML(withOm) {
  let h = "";
  LEI.forEach(p => {
    if (p.tt) { h += `<div class="tt">${p.tt}</div>`; return; }
    let i = 0;
    const t = withOm ? p.t.replace(omRe, (m, x, a) => `<span class="om" data-a="${a}" data-o="o-${p.id}-${i++}">${x}</span>`) : plain(p.t);
    h += `<p id="${withOm ? "" : "d-"}${p.id}" data-art="${p.art}" class="${p.inc ? "inc" : ""}">${t}</p>`;
    if (p.n && withOm) h += `<div class="note">${p.n}</div>`;
  });
  return h;
}
