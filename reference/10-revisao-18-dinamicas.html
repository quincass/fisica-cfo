function startRun(key, items) { S.runs[key] = { q: items.map(id => ({ id })), i: 0 }; save(); }
function runHTML(key, opts = {}) {
  const R = S.runs[key];
  if (!R || !R.q.length) return `<p class="empty">Nada para mostrar aqui.</p>`;
  if (R.i >= R.q.length) return doneHTML(key, opts);
  const it = R.q[R.i], X = IDX[it.id];
  const ansd = X.k === "card" ? it.s != null : it.pick != null;
  const prog = `<div class="meta">${R.i + 1} de ${R.q.length}${ansd ? ` · <span class="tag al">${ALVOS[X.a]}</span>` : ""}</div><div class="prog"><i style="width:${(R.i / R.q.length) * 100}%"></i></div>`;
  let h = prog + `<div class="box">`;
  if (X.k === "ce") {
    h += `<div class="meta">Certo ou errado?</div><div class="q">${X.t}</div>`;
    if (it.pick == null) h += `<div class="ans"><button class="btn" data-ce="1">Certo</button><button class="btn" data-ce="0">Errado</button></div>`;
    else {
      const ok = it.s === 1;
      h += `<div class="fb ${ok ? "ok" : "bad"}"><div class="v">${ok ? "Acertou" : "Errou"} · Gabarito: ${X.g ? "CERTO" : "ERRADO"}</div><span class="tag arm">${X.arm}</span><p>${X.c}</p>${artLink(X.art)}</div>`;
    }
  } else if (X.k === "mc") {
    if (!it.ord) { it.ord = shuffle(X.o.map((_, i) => i)); save(); }
    h += `<div class="meta">${X.id[0] === "s" ? "Reconhecimento" : "Múltipla escolha"}</div><div class="q">${X.q}</div><div class="alts">`;
    it.ord.forEach((oi, pos) => {
      const o = X.o[oi], L = "ABCDE"[pos];
      let cls = "";
      if (it.pick != null) { if (o.ok) cls = "right"; else if (oi === it.pick) cls = "wrong"; }
      h += `<button class="alt ${cls}" data-mc="${oi}" ${it.pick != null ? "disabled" : ""}><b>${L})</b><span>${o.t}${it.pick != null ? `<span class="ac">${o.c}</span>` : ""}</span></button>`;
    });
    h += `</div>`;
    if (it.pick != null) {
      const okPos = it.ord.findIndex(oi => X.o[oi].ok);
      h += `<div class="fb ${it.s === 1 ? "ok" : "bad"}"><div class="v">${it.s === 1 ? "Acertou" : "Errou"} · Gabarito: ${"ABCDE"[okPos]}</div>${artLink(X.art)}</div>`;
    }
  } else {
    h += `<div class="fc"><span class="tag">${X.tp}</span><div class="face">${X.f}</div>`;
    if (!it.flip) h += `<div class="row" style="margin-top:16px"><button class="btn pri" data-flip>Mostrar resposta</button></div>`;
    else {
      h += `<div class="back"><div class="face">${X.v}</div>${X.x ? `<div class="x">${X.x}</div>` : ""}</div>`;
      if (it.s == null) h += `<div class="grade"><button class="btn g0" data-gr="0">Errei</button><button class="btn g1" data-gr="0.5">Hesitei</button><button class="btn g2" data-gr="1">Acertei</button></div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  const answered = (X.k === "card") ? it.s != null : it.pick != null;
  h += `<div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn sm" data-prev ${R.i === 0 ? "disabled" : ""}>← Anterior</button><button class="btn ${answered ? "pri" : ""}" data-next ${answered ? "" : "disabled"}>Próxima →</button></div>`;
  return `<div data-run="${key}">${h}</div>`;
}
function doneHTML(key, opts) {
  const R = S.runs[key];
  const seen = {}; let n = 0, s = 0; const wrong = [];
  R.q.forEach(it => { if (it.s == null || seen[it.id] !== undefined) return; seen[it.id] = it.s; n++; s += it.s; if (it.s < 1) wrong.push(it.id); });
  let h = `<div class="box done"><div class="meta">Concluído</div><b>${n ? pct(s / n) : "—"}</b><div>${n} itens · ${wrong.length} com erro ou hesitação</div>`;
  if (opts.after) h += opts.after(wrong);
  h += `<div class="row" style="justify-content:center;margin-top:16px">${wrong.length ? `<button class="btn pri" data-redo="${key}">Refazer os ${wrong.length} errados</button>` : ""}<button class="btn" data-restart="${key}">Recomeçar do zero</button></div></div>`;
  return h;
}
document.addEventListener("click", e => {
  const host = e.target.closest("[data-run]"); if (!host) return;
  const key = host.dataset.run, R = S.runs[key]; if (!R) return;
  const it = R.q[R.i]; const X = it && IDX[it.id];
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.ce != null && it.pick == null) {

    it.pick = +t.dataset.mc; it.s = X.o[it.pick].ok ? 1 : 0; record("mc", X.id, X.a, it.s);

  save(); render();
});
document.addEventListener("click", e => {

  if (z) { const k = z.dataset.restart; startRun(k, defaultItems(k)); render(); }

function defaultItems(k) {
  if (k === "sond") return SOND.map(x => x.id);
  if (k === "ce") return shuffle(CE.map(x => x.id));
  if (k === "mc") return shuffle(MC.map(x => x.id));
  if (k === "cards") return shuffle(CARDS.map(x => x.id));
  if (k === "rev") return revQueue();
  if (k === "micro10") return microQueue();
  if (k === "errtrain") return errQueue();
  return [];
}
function ensureRun(k) { if (!S.runs[k]) startRun(k, defaultItems(k)); }

// ---------- filas de revisão ----------
function revQueue() {
  const last = S.sessions[S.sessions.length - 1];
  const prevErr = last ? [...new Set(last.res.filter(r => r.s < 1 && ["ce", "mc", "card"].includes(r.k) && IDX[r.id]).map(r => r.id))] : [];
  const pool = [...CE, ...MC, ...CARDS].map(x => x.id);
  const used = new Set(prevErr), extra = [];
  Object.keys(ALVOS).forEach(a => {
    const cand = shuffle(pool.filter(id => IDX[id].a === a && !used.has(id)));
    cand.slice(0, 1).forEach(id => { used.add(id); extra.push(id); });
  });
  // completa com itens de alvos frágeis
  const weak = Object.keys(ALVOS).filter(a => S.life[a] && S.life[a].s / S.life[a].n < 0.75);
  shuffle(pool.filter(id => weak.includes(IDX[id].a) && !used.has(id))).slice(0, 6).forEach(id => { used.add(id); extra.push(id); });
  return [...shuffle(prevErr), ...shuffle(extra)];
}
function microQueue() {
  const ranked = Object.keys(ALVOS).filter(a => S.life[a]).sort((a, b) => S.life[a].s / S.life[a].n - S.life[b].s / S.life[b].n);
  const pool = [...CE, ...MC, ...CARDS].map(x => x.id);
  const out = [];
  for (const a of ranked) { for (const id of shuffle(pool.filter(id => IDX[id].a === a))) { if (out.length >= 10) break; if (!out.includes(id)) { out.push(id); if (out.filter(x => IDX[x].a === a).length >= 2) break; } } if (out.length >= 10) break; }
  shuffle(pool).forEach(id => { if (out.length < 10 && !out.includes(id)) out.push(id); });
  return shuffle(out);
}
function errQueue() { return shuffle(Object.values(S.errors).filter(e => IDX[e.id]).map(e => e.id)); }

  const errs = [...new Set(S.cur.res.filter(r => r.s < 1).map(r => r.id))];
  let md = `## ${LEI_NOME} · ${BLOCO} · ${today()}\n- Modo: ${S.cur.mode}\n- Desempenho: ${pct(st.p)} (${st.s.toFixed(1).replace(".0", "")}/${st.n})\n- Segurança sugerida: ${st.nota}\n`;
  md += `- Alvos frágeis:\n` + (fr.length ? fr.map(a => `  - ${ALVOS[a]}: ${pct(st.by[a].s / st.by[a].n)} (${st.by[a].n} itens)`).join("\n") : "  - nenhum") + "\n";
  md += `- Itens com erro: ${errs.length}\n`;
  const un = Object.keys(ALVOS).filter(a => !st.by[a]).length; if (un) md += `- Nota parcial: ${un} alvos não testados\n`;
  return md;
}
function renderFech(v) {
  const st = sessionStats(S.cur.res);
  const rows = Object.keys(ALVOS).map(a => { const b = st.by[a]; if (!b) return ""; const p = b.s / b.n; const col = p >= 0.8 ? "var(--ok)" : p >= 0.6 ? "var(--mid)" : "var(--bad)";
    return `<tr><td>${ALVOS[a]}</td><td>${b.n}</td><td style="min-width:120px"><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${p * 100}%;background:${col}"></i></div><span>${pct(p)}</span></div></td></tr>`; }).join("");
  const untouched = Object.keys(ALVOS).filter(a => !st.by[a]);
  v.innerHTML = `<h2>Fechamento da sessão</h2><p class="lead">Sessão iniciada em ${new Date(S.cur.start).toLocaleString("pt-BR")} · modo ${S.cur.mode}. Conta tudo o que você respondeu nesta sessão: sondagem, omissões, mapa em teste, C/E, múltipla escolha, cards e pacotes do caderno.</p>
  <div class="stats"><div class="stat"><span class="meta">Itens respondidos</span><b>${st.n}</b></div><div class="stat"><span class="meta">Desempenho</span><b>${st.n ? pct(st.p) : "—"}</b></div><div class="stat"><span class="meta">Alvos críticos (&lt;60%)</span><b>${st.crit.length}</b></div><div class="stat"><span class="meta">Segurança sugerida</span><b>${st.n ? st.nota : "—"}</b></div></div>
  <div class="box" style="font-size:.9rem"><b>Regra da nota sugerida</b> (decisão final é sua): ≥90% e nenhum alvo crítico → 5 · ≥80% → 4 · ≥65% → 3 · ≥50% → 2 · abaixo → 1. Com 3 ou mais alvos críticos, a nota fica limitada a 3. “Hesitei” vale meio ponto.</div>
  <h3>Desempenho por alvo</h3>${rows ? `<div class="tw"><table><tr><th>Alvo</th><th>Itens</th><th>Acerto</th></tr>${rows}</table></div>` : `<p class="empty">Nenhum item respondido nesta sessão.</p>`}
  ${untouched.length && st.n ? `<div class="box" style="border-color:var(--mid);margin-top:10px"><b>Nota parcial.</b> ${untouched.length} de ${Object.keys(ALVOS).length} alvos ainda não foram testados nesta sessão. A nota sugerida só reflete o bloco inteiro quando todos os alvos aparecem (a bateria de revisão garante isso).</div>` : ""}
  <h3>Para o Obsidian</h3><textarea id="md" readonly>${exportMD(st)}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn pri" id="cp">Copiar</button><span class="meta" id="cpm"></span></div>
  <h3>Encerrar</h3><p class="meta">Salva esta sessão no histórico (os erros dela abrem a próxima revisão) e começa uma nova. O caderno de erros é mantido.</p>
  <button class="btn" id="endS">Encerrar sessão e iniciar nova</button>
  ${S.sessions.length ? `<h3>Histórico</h3><div class="tw"><table><tr><th>Data</th><th>Modo</th><th>Itens</th><th>Desempenho</th><th>Nota sugerida</th></tr>${S.sessions.slice().reverse().map(x => { const t = sessionStats(x.res); return `<tr><td>${new Date(x.start).toLocaleDateString("pt-BR")}</td><td>${x.mode}</td><td>${t.n}</td><td>${pct(t.p)}</td><td>${t.nota}</td></tr>`; }).join("")}</table></div>` : ""}`;
  $("#cp").onclick = () => { const ta = $("#md"); const done = () => $("#cpm").textContent = "Copiado."; if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand("copy"); done(); }); else { ta.select(); document.execCommand("copy"); done(); } };
  $("#endS").onclick = () => { if (!S.cur.res.length) return; if (!confirm("Encerrar a sessão atual?")) return;
    S.sessions.push(S.cur); S.sessions = S.sessions.slice(-30); S.cur = newSession({ estudo: "Estudo", revisao: "Revisão", micro: "Micro-sessão", pacotes: "Pacotes" }[S.mode]);
    ["ce", "mc", "cards", "rev", "micro10", "errtrain"].forEach(k => delete S.runs[k]); mapReset(false); save(); render(); };
}

// ---------- CADERNO DE ERROS ----------
function errText(e) {
  const X = IDX[e.id];
  if (X) return X.k === "ce" ? X.t : X.k === "mc" ? X.q : X.f;
  return e.txt || (e.k === "om" ? "Omissão na lei" : "Item do mapa");
}
function openErrors() {
  const list = Object.values(S.errors).sort((a, b) => b.n - a.n);
  const kinds = { ce: "C/E", mc: "Múltipla escolha", card: "Card", om: "Omissão", map: "Mapa", pac: "Pacote do caderno", rec: "Reconhecimento" };
  let h = list.length ? `<div class="row" style="margin-bottom:10px"><button class="btn pri" id="trainE">Treinar erros (C/E, ME e cards)</button></div>` : `<p class="empty">Caderno vazio.</p>`;
  h += list.map(e => { const X = IDX[e.id];
    return `<div class="err"><div class="meta">${kinds[e.k]} · ${e.n}× · último em ${e.last}${e.lastOk ? " · <b style='color:var(--ok)'>acertou depois</b>" : ""}</div><div class="et">${errText(e)}</div>
    <div>${X && X.arm ? `<span class="tag arm">${X.arm}</span>` : ""}<span class="tag">${ALVOS[e.a] || ""}</span></div>
    <div class="row">${X && X.art ? artLink(X.art) : ""}<button class="btn sm" data-del="${e.id}">Remover</button></div></div>`; }).join("");
  drawer("Caderno de erros", h);
  if ($("#trainE")) $("#trainE").onclick = () => { startRun("errtrain", errQueue()); S.tab = "errtrain"; save(); closeDrawer(); render(); };
  $$("[data-del]", $("#dB")).forEach(b => b.onclick = () => { delete S.errors[b.dataset.del]; save(); openErrors(); });
}

// ---------- PACOTES DO CADERNO ----------
// Cada pacote tem 20 vagas: uma para cada dinâmica e duas de bônus para as de maior peso no CBM PE.
// A questão fica no caderno TEC; aqui vão só o número, o gabarito (revelado depois) e o vídeo do molde.
let pacAtual = 0;
const isCE = n => QB[n].g === "Certo" || QB[n].g === "Errado";
const ytURL = id => "https://www.youtube.com/watch?v=" + id;
function vidList(it) {
  if (it.d === "D17" && it.nums.some(n => BARRA.includes(n))) return VID.D17b;
  if (it.d === "D08" && it.nums.some(n => BARRA.includes(n))) return VID.D08b;
  return VID[it.d] || [];
}
function pacState(p) { S.pac = S.pac || {}; return S.pac[p] || (S.pac[p] = { rec: {}, ans: {} }); }
function pacResumo(p) {
  const st = pacState(p), nums = PAC[p].flatMap(it => it.nums);
  const feitas = nums.filter(n => st.ans[n] != null), certas = feitas.filter(n => st.ans[n] === QB[n].g);
  const rec = Object.keys(st.rec).length, recOk = PAC[p].filter((it, i) => st.rec[i] === it.d).length;
  return { nums, feitas, certas, rec, recOk };
}
function renderPac(v) {
  const p = pacAtual, st = pacState(p), R = pacResumo(p);
  let h = `<h2>Pacotes do caderno</h2>
  <p class="lead">Seis pacotes de 20 vagas, todos com as 18 dinâmicas e mais duas vagas de bônus para as que mais caem no CBM PE (campo criado, superposição, carga em círculo, Faraday). Resolva no caderno TEC pelo número. Aqui, para cada vaga: <b>1</b> diga de que dinâmica é antes de resolver, <b>2</b> marque a sua letra, <b>3</b> veja o vídeo do mesmo molde.</p>
  <div class="row" style="margin-bottom:12px">${PAC.map((_, i) => { const r = pacResumo(i); return `<button class="btn sm ${i === p ? "pri" : ""}" data-pac="${i}">Pacote ${i + 1}${r.feitas.length ? ` · ${r.certas.length}/${r.nums.length}` : ""}</button>`; }).join("")}</div>
  <div class="stats"><div class="stat"><span class="meta">Questões feitas</span><b>${R.feitas.length}/${R.nums.length}</b></div><div class="stat"><span class="meta">Acertos</span><b>${R.feitas.length ? pct(R.certas.length / R.feitas.length) : "—"}</b></div><div class="stat"><span class="meta">Dinâmica reconhecida</span><b>${R.rec ? R.recOk + "/" + R.rec : "—"}</b></div></div>`;
  h += PAC[p].map((it, i) => {
    const vids = vidList(it), vd = vids.length ? vids[p % vids.length] : null;
    const q0 = QB[it.nums[0]];
    const tags = [it.nums.some(n => QB[n].pe) ? `<span class="tag arm">★ CBM PE</span>` : it.nums.some(n => QB[n].cbm) ? `<span class="tag">CBM</span>` : "",
      it.nums.some(n => QB[n].E) ? `<span class="tag" style="color:var(--apo)">estresse · ITA/IME</span>` : "",
      it.rep ? `<span class="tag" title="já apareceu num pacote anterior">↻ repetição</span>` : "",
      it.bonus ? `<span class="tag" style="color:var(--exe)">bônus de peso</span>` : ""].join("");
    const recPick = st.rec[i];
    const recHTML = recPick == null
      ? `<label class="meta">1 · De que dinâmica é? <select data-rec="${i}"><option value="">escolha…</option>${Object.keys(ALVOS).map(a => `<option value="${a}">${ALVOS[a]}</option>`).join("")}</select></label>`
      : `<div class="meta">1 · ${recPick === it.d ? `<b style="color:var(--ok)">✓ reconheceu</b>` : `<b style="color:var(--bad)">✗ você disse ${ALVOS[recPick].split(" · ")[0]}</b>`} · é <b>${ALVOS[it.d]}</b>${it.nums.length > 1 ? " (vale para o enunciado; cada item conta na sua dinâmica)" : ""}</div>`;
    const ansHTML = it.nums.map(n => {
      const g = QB[n].g, mine = st.ans[n];
      const opts = isCE(n) ? ["Certo", "Errado"] : ["A", "B", "C", "D", "E"];
      const fb = mine == null ? "" : mine === g ? ` <b style="color:var(--ok)">✓</b>` : ` <b style="color:var(--bad)">✗ gabarito ${g}</b>`;
      return `<div class="row" style="margin-top:6px"><span style="min-width:4.2em;font-weight:600">Q ${n}</span>${opts.map(o => `<button class="btn sm ${mine === o ? "pri" : ""}" data-ans="${n}" data-v="${o}" ${mine != null ? "disabled" : ""}>${o === "Certo" ? "C" : o === "Errado" ? "E" : o}</button>`).join("")}${fb}${QB[n].vista ? ` <span class="meta" title="usada como molde ou exemplo numa aula">· já vista em aula</span>` : ""}</div>`;
    }).join("");
    return `<div class="box" style="margin-bottom:10px">
      <div class="row" style="justify-content:space-between"><div><b style="font-size:1.15rem">Q ${it.nums.join(", ")}</b> <span class="meta">· ${q0.b}${it.nums.length > 1 ? " · mesmo enunciado" : ""}</span></div><div>${tags}</div></div>
      <div style="margin-top:8px">${recHTML}</div>
      <div class="meta" style="margin-top:8px">2 · Sua resposta no caderno</div>${ansHTML}
      <div class="row" style="margin-top:10px">${vd ? `<a class="btn sm" href="${ytURL(vd.id)}" target="_blank" rel="noopener">▶ 3 · ${vd.t.length > 70 ? vd.t.slice(0, 68) + "…" : vd.t}</a><span class="meta">${vd.c}</span>` : ""}${vids.length > 1 ? `<button class="artl" data-vids="${it.d}${vids === VID.D17b ? "b" : vids === VID.D08b ? "b" : ""}">mais vídeos do molde</button>` : ""}<button class="artl" data-art="${+it.d.slice(1)}">ver regra ${it.d.replace("D0", "D")}</button></div>
    </div>`;
  }).join("");
  h += `<div class="row" style="margin-top:14px"><button class="btn" id="pacZera">Refazer este pacote</button><span class="meta">Apaga só as marcações do pacote; o histórico por dinâmica continua.</span></div>`;
  const res = Object.entries(RES);
  if (res.length) h += `<h3>Reserva</h3><p class="meta">Questões classificadas que não entraram em pacote (quase todas ITA/IME). Use quando quiser estresse extra numa dinâmica.</p><div class="tw"><table><tr><th>Dinâmica</th><th>Questões</th></tr>${res.map(([d, ns]) => `<tr><td>${ALVOS[d]}</td><td>${ns.join(", ")}</td></tr>`).join("")}</table></div>`;
  v.innerHTML = h;
  $$("[data-pac]", v).forEach(b => b.onclick = () => { pacAtual = +b.dataset.pac; renderPac(v); window.scrollTo(0, 0); });
  $$("select[data-rec]", v).forEach(s => s.onchange = () => {
    if (!s.value) return; const i = +s.dataset.rec, it = PAC[p][i], ok = s.value === it.d ? 1 : 0;
    st.rec[i] = s.value; const id = `rec-${p}-${i}`;
    record("rec", id, it.d, ok); if (!ok) S.errors[id].txt = `Reconhecimento · Q ${it.nums.join(", ")}: você disse ${ALVOS[s.value]}, era ${ALVOS[it.d]}`;
    save(); renderPac(v);
  });
  $$("[data-ans]", v).forEach(b => b.onclick = () => {
    const n = +b.dataset.ans; if (st.ans[n] != null) return;
    st.ans[n] = b.dataset.v; const ok = st.ans[n] === QB[n].g ? 1 : 0, id = "pac-" + n;
    record("pac", id, QB[n].a, ok); if (!ok) S.errors[id].txt = `Caderno · Q ${n} (${QB[n].b}): marcou ${st.ans[n]}, gabarito ${QB[n].g}`;
    save(); renderPac(v);
  });
  $$("[data-vids]", v).forEach(b => b.onclick = () => {
    const k = b.dataset.vids, key = k.endsWith("b") ? k.slice(0, 3) + "b" : k, L = VID[key] || [];
    drawer("Vídeos do molde · " + ALVOS[k.slice(0, 3)], L.map(x => `<div class="err"><a href="${ytURL(x.id)}" target="_blank" rel="noopener" class="et">${x.t}</a><div class="meta">${x.c}</div></div>`).join("") + `<p class="meta">Todos conferidos pela API do YouTube (título e canal). Nenhum resolve uma das 40 lacradas.</p>`);
  });
  $("#pacZera").onclick = () => { if (!confirm("Apagar as marcações do pacote " + (p + 1) + "?")) return; S.pac[p] = { rec: {}, ans: {} }; save(); renderPac(v); };
}
function renderLacre(v) {
  v.innerHTML = `<h2>Questões lacradas</h2>
  <p class="lead">Estas 40 questões ficam <b>fora</b> de todos os pacotes. São o simulado cego da missão: resolva só depois de fechar as 18 dinâmicas, de uma vez, sem consulta. Meta: 90%. Não abra nenhuma delas antes — nem para “dar uma olhada”.</p>
  <div class="box"><div style="font:600 1.15rem/1.9 Archivo,sans-serif;word-spacing:.35em">${LACRE.join(" · ")}</div></div>
  <p class="meta" style="margin-top:12px">Por que a lista pesa para o Grupo 1: as questões das Famílias I a III do caderno já tinham sido usadas como molde nas aulas, e questão vista não serve para simulado cego. Faraday, fluxo, transformador, seletor, gráficos, superposição e fios paralelos não têm questão inédita sobrando — ficam só nos pacotes.</p>`;
}

// ---------- inicialização ----------
$(".brand h1").textContent = BLOCO_H1; $(".brand p").textContent = BLOCO_SUB; document.title = BLOCO_H1 + " · " + BLOCO_SUB;
$("#bLei").onclick = () => openArt(null);
$("#bErr").onclick = openErrors;
$("#dX").onclick = closeDrawer; $("#dSh").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
if (!TABS[S.mode]) S.mode = "estudo";
if (!TABS[S.mode].some(t => t[0] === S.tab) && S.tab !== "errtrain") S.tab = TABS[S.mode][0][0];
if (S.tab === "rmapa") mapReset(true);
render();
</script></body></html>
